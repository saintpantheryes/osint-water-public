  AZ_PPL:
    funder: GOV
    name_zh: 阿塞拜疆《公共采购法》(第 988-VIQ 号,2023-07-14 通过,2024-01-01 生效)
    nationality: domestic_open
    local_registration: bid
    platform: 国家电子采购门户 etender.gov.az(须阿方认可的合格电子签名)
    summary: 居民与非居民均可参与,不得以国籍排除;只能经统一电子门户采购,工程以公开招标为主;投标文件须用阿塞拜疆语(允许附通用语言译本);设有本国货物优先(幅度未核实)。外国企业须取得合格电子签名,实际通常需先在当地注册——按"投标前须注册"保守处理。
    notes:
      - 成稿列投标保证金 1%–3%、履约保证金 10%;另有二手资料称履约保证金 5%–10%,以法律条文为准。
      - 由总统批准监事会的商业实体使用非预算资金时不适用本法——两家新设水务股份公司的采购适用性待核实。
    grade: B
    src:
      - {title: 法律原文(未能打开), url: "https://e-qanun.az/framework/54966", via: report_baseline}
      - {title: 阿塞拜疆水务市场分析报告(成稿)5.2、13.1 节, via: report_baseline}

  AZ_PPP:
    funder: GOV
    name_zh: 阿塞拜疆《公私合作伙伴关系法》(第 691-VIQ 号,2022-12)
    nationality: per_tender
    local_registration: contract
    platform: 经济部(PPP 主管),以资格预审/招标文件为准
    summary: 经济部组织竞争性程序或直接谈判,也可由申请人以私人倡议发起;项目最长 49 年;政府支持可含收入担保、购买承诺、补贴、贷款、价格监管保证;外国投资人通常经当地项目公司参与。实施细则进展待核实。
    grade: B
    src:
      - {title: 阿塞拜疆水务市场分析报告(成稿)5.2、10.4 节, via: report_baseline}

  MA_MP:
    funder: GOV
    name_zh: 摩洛哥《公共采购法令》(第 2-22-431 号法令,2023-03-08 颁布,2023-09-01 生效)
    nationality: domestic_open
    local_registration: none
    platform: 国家公共采购门户 marchespublics.gov.ma(检索、下载招标文件免费;电子投标须注册企业账号并用电子签名证书)
    summary: 外国企业可投。第 147 条本国优惠:非在摩洛哥设立的投标人参加工程、货物、服务招标时,财务评审中其报价与基准价比较后上调或下调 15%(以摩洛哥批准的国际协定为限),2023 年起为强制适用。第 150 条:可组连带或联合联合体,业主不得强制组联合体;受资质分级制度约束的工程,联合体每个成员都须持资质与分级证书。外国企业可用本国资质与业绩证明代替摩洛哥资质证书,以咨询规则为准。
    notes:
      - 第 149 条当地用工:工程与服务(研究除外)合同须含使用当地劳动力条款,比例由专用条款规定,最高为所需人员的 20%;"当地"指项目所在市镇,或省、大区。
      - 塔拉灌区项目咨询规则(转引使用方分析报告):本国成员占比不低于 30% 的联合体视同本国企业,不受 15% 调价;财务标按基准价法(基准价 = (业主预估 + 平均报价)/2,取低于且最接近基准价者)——15% 调价在这种算法下影响很大。
    grade: A
    src:
