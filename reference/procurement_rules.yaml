  ISDB_PG:
    funder: ISDB
    name_zh: 伊斯兰开发银行《货物、工程及相关服务采购指南》与《咨询服务采购指南》(2019-04 版,2023-02 修订)
    nationality: members_only
    local_registration: unknown
    platform: IsDB 官网采购公告(Tenders)与执行机构网站
    summary: 工程与货物用"仅限成员国的国际竞争性招标"(ICB/MC),咨询用"仅限成员国的质量与费用评选"(QCBS-MC)或最低费用选择(LCS)。中国不是成员国,不能作为投标人或联合体成员。
    notes:
      - 可能的例外(联合融资放开、非成员国企业作分包或供货的比例上限、在成员国注册的子公司是否按注册地认定)均未核实——以具体招标文件的合格性条款为准。
      - 阿塞拜疆实例(均读原文):卡拉巴赫灌溉渠(AZE 1028)总采购公告与咨询意向书;少女塔水库主灌溉渠(AZE 1024)特定采购公告——单阶段 ICB/MC、不做资格预审、投标保证金 100 万美元。见 countries/AZE 台账 AZE-020、AZE-024。
    grade: A
    src:
      - {title: "Reconstruction of the Karabakh Irrigation Canal Project – GPN (AZE 1028)", url: "https://www.isdb.org/project-procurement/tenders/2026/gpn/reconstruction-karabakh-irrigation-canal-project-gpn", via: primary_read}
      - {title: "Main Irrigation Canal from the Maiden Tower Reservoir – SPN (AZE 1024)", url: "https://adsea.gov.az/events/0409202644", via: primary_read}

  OPECFUND_PG:
    funder: OPECFUND
    name_zh: 欧佩克基金《货物、工程与服务采购原则》及两份采购程序(2024-07)
    nationality: open_all
    local_registration: unknown
    platform: 借款人发布;欧佩克基金官网"当前采购机会"
    summary: 2024-07 起的采购框架为《采购原则》加《咨询服务采购程序》与《货物、工程与非咨询服务采购程序》。苏姆盖特污水厂咨询意向书(2026-08,读原文)写明主体工程按其程序国际竞争性招标(ICB)、用欧佩克基金标准招标文件与协调版 FIDIC,公告未设国别限制;公共部门贷款据了解为非捆绑。《采购原则》原文为在线翻页版,下载 403,国别合格性条款未读到——以招标文件为准。
    notes:
      - 联合融资时通常沿用牵头方规则;与 IsDB 联合出资的标段可能改用"仅限成员国"。
    grade: B
    src:
      - {title: OPEC Fund 当前采购机会, url: "https://opecfund.org/work-with-us/project-procurement/current-opportunities", via: primary_read}
      - {title: OPEC Fund 项目采购框架(原则与程序), url: "https://opecfund.org/work-with-us/project-procurement", via: primary_read}
      - {title: "Sumgayit WWTP Project – REOI 与任务书(贷款 17052PA)", url: "https://adsea.gov.az/events/2408202634", via: primary_read}

