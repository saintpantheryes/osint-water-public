regimes:
  WB_IPF:
    funder: WB
    name_zh: 世界银行《投资项目融资借款人采购规则》(第 7 版,2025-09)
    nationality: open_all
    local_registration: contract
    platform: 借款人发布(世行项目采购公告 API/UNDB);投标人无须在世行注册
    summary: 允许所有国家的合格企业和个人提供货物、工程与服务(第 3.20–3.21 段);例外仅限借款国法律禁止与该国商业往来、执行联合国安理会第七章决定,或企业被世行制裁(第 3.22–3.23 段)。外国投标人投标时无须当地注册,中标后签约前给予注册机会。
    notes:
      - 第 5.54 段(当地劳动力参与):凡须用标准招标文件的国际竞争性工程合同,借款人须要求投标人把不低于一定比例的合同人工费用于当地员工,比例由世行在标准招标文件中设定;还可设技能培训类评分项——对依赖自有队伍的中资企业是实质约束。
      - 国内优惠(第 5.52 段):货物按到岸价加 15%;工程 7.5% 只适用于人均国民收入低于世行门槛的借款国——阿塞拜疆为中高收入国家,推定工程标不适用。
    grade: A
    src:
      - {title: "Procurement Regulations for IPF Borrowers, 7th ed. (Sep 2025)", url: "https://thedocs.worldbank.org/en/doc/c84273d1b230aeb2b0b8134de5dc8cd7-0290012025/original/Procurement-Regulations-7th-Edition-Sep-2025.pdf", via: primary_read}
      - {title: "Summary of Revisions (Sep 2025)", url: "https://thedocs.worldbank.org/en/doc/e3eabf1f044cca90dd6d1728976e2a4b-0290012025/original/Regulations-Summary-of-Revisions-Sep-2025.pdf", via: search_snippet}
      - {title: 世行采购计划标准条款(外国投标人无须注册即可投标), url: "https://documents1.worldbank.org/curated/en/099102325203015262/pdf/P166420-c5004dc3-5fa7-47df-bc42-751e7350383b.pdf", via: search_snippet}
      - {title: 世行制裁/禁入名单(按企业), url: "https://www.worldbank.org/en/projects-operations/procurement/debarred-firms", via: search_snippet}

  ADB_PD2026:
    funder: ADB
    name_zh: 亚行《采购政策》(2017)与《借款人采购指令》(2026-01-01 生效)
    nationality: members_only
    local_registration: unknown
    platform: 执行机构发布并在亚行网站公告;工程与货物无须在亚行注册(咨询服务用 CMS)
    summary: 《借款人采购指令》第 3.12–3.13 段:普通资金与亚行管理资金只能采购亚行成员国生产并供应的货物、工程与服务,所有合格成员国的投标人均可参与;融资协议规定"全球采购"时不限。中国是成员国。
    notes:
      - 2026-01-01 起国际公告的公开竞争性招标一律用优点评分(第 6.17 段),高风险高价值合同技术分权重不低于 50%;国际公告的工程合同至少一半劳动力须来自借款国境内(第 6.6 段,亚行书面同意除外);技术分中最多 25% 可给可持续性考量,其中最多 15% 可给当地就业与技能培训措施(第 6.7 段)。
      - 工程国内优惠(≤7.5%)只适用于按人均收入合格的国家,阿塞拜疆大概率不适用。
    grade: A
    src:
      - {title: ADB FAQ:投标资格(成员国国籍、全球采购、原产地), url: "https://www.adb.org/business/how-to/what-are-main-eligibility-requirements-bidding-contracts-under-adb-financed-projects", via: search_snippet}
      - {title: "Procurement Directive for ADB Borrowers (Jan 2026)", url: "https://www.adb.org/sites/default/files/institutional-document/1144641/procurement-directive-adb-borrowers.pdf", via: primary_read}
      - {title: ADB 2026 年起强制优点评分与当地劳动力要求(2025-09-16 新闻), url: "https://www.adb.org/news/adb-require-merit-point-criteria-2026-evolving-its-procurement-approach-enhance-quality", via: primary_read}

  EBRD_PPR:
    funder: EBRD
    name_zh: 欧洲复兴开发银行《采购政策与规则》(2026 版 2026-09-01 生效;此前立项的项目沿用 2022 版)
    nationality: open_all
    local_registration: contract
    platform: ECEPP(ecepp.ebrd.com)——下载标书、澄清、递交均须注册
    summary: 允许所有国家的企业和个人提供货物、工程与服务,无论是否为成员国;2026 版引《EBRD 成立协定》第 13 条——银行不限制用其资金从任何国家采购。
    notes:
      - 2026 版 2026-09-01 生效,取代 2022 版;只适用于此后通过概念审查的项目,此前通过的沿用 2022 版(客户与银行另行约定除外)。
      - 投标阶段是否要求当地注册未见规定;在借款国施工须按当地法律注册并取得许可(见各国台账的准入门槛)。
    grade: A
    src:
      - {title: "EBRD PPR 2022(\"regardless of whether the country is a member\")", url: "https://www.ebrd.com/content/dam/ebrd_dxp/assets/pdfs/project-procurement/procurement-policies-and-rules/ppr-2022/PPR-2022-English.pdf", via: search_snippet}
      - {title: EBRD PPR 2026, url: "https://www.ebrd.com/content/dam/ebrd_dxp/assets/pdfs/project-procurement/directives-and-guidances/20260901_PPR%202026_ENG_Final.pdf", via: primary_read}
      - {title: ECEPP 门户, url: "https://ecepp.ebrd.com/", via: search_snippet}

  AIIB_PP:
    funder: AIIB
    name_zh: 亚投行《采购政策》
    nationality: open_all
    local_registration: unknown
    platform: 亚投行官网项目采购公告
    summary: 据《亚投行协定》不限制从任何国家采购(待复核原文);与世行、亚行、EBRD 联合融资时通常适用牵头方规则。
    grade: C
