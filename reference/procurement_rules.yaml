# 投标资格规则表:按出资方/采购制度记录"谁能投标"。公开信息,CC BY 4.0。
# core 用它 × profile.bidder.nationality 推出每个项目的资格结论;项目公告里的明示条款(台账 procurement.eligibility)优先。
# nationality:open_all 各国均可 | members_only 仅限成员国(看 funders.*.known_members/known_non_members)
#              | tied 限定来源国(tied_to)| domestic_open 本国采购法、外国企业可参与 | per_tender 以招标文件为准 | unknown
# local_registration:none | bid 投标前须在当地注册/取得电子签名 | contract 签约前 | unknown
# grade:A 读到官方文件原文(含官方文件的检索摘要)| B 二手(机构指南、招标公告、成稿转引)| C 未核实/据常识推断
