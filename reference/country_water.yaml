#   调水、海水淡化公司与水务 PPP 采购方;按合同运营全国或主要城市供水的私营公司也列出,名称后注明"非国企"并写明股权);
#   laws 相关法律法规(kind:water 水法与水资源、
#   wss 供水排水与污水、ppp PPP 与特许经营、procurement 公共采购、env 环境与环评、other 其他;year 通过年份,修订写在 note)。
#   name_zh 中文名;name 原文名称;name_en 英文名(可无);role / note 职能或说明;url 官网或法律原文(没有为 null);
#   src 来源:title 出处名称,url 网址,via 核实方式——primary_read 打开官方页面或法律原文核对过,secondary 打开权威二手资料
#   (FAOLEX、世行/非行/亚行项目文件等)核对过,search_snippet 只见检索摘要(待核实)。
#   notes 这一国水务管理体制的一句话说明(可无)。
# 先收使用方市场分布表里的国别(按区域排列);其他国别需要时按同样格式追加。
