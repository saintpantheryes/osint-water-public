    pt: [despoluição]
  general:            # 只说明"是水务",不定具体领域(机构名里常有"水资源",不能据此归到水利)
    zh: 水务(综合)
    en: [treatment plant, hydraulic, SCADA, water sector, water and sanitation, WASH, water resources, water security,
         pumping station, pump station, water resource, water conservation, water saving, water efficiency,
         water use efficiency, water management, water services, water infrastructure, groundwater, drainage]
    az: [su təsərrüfatı, su ehtiyatları, nasos stansiyası]
    ru: [водное хозяйство, водохозяйств, водных ресурс, насосн]
    fr: [secteur de l'eau, ressources en eau, ressources hydriques, gestion de l'eau, économie d'eau, économies d'eau,
         eaux souterraines, station de pompage, hydraulique, station de traitement]
    es: [sector agua, recursos hídricos, gestión del agua, aguas subterráneas, hidráulic]
    pt: [recursos hídricos, gestão da água, águas subterrâneas, hidráulic]
    ar: [الموارد المائية]

