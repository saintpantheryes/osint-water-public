# 监测规则词表:按领域分组的多语种水务词 × 机会阶段词。只做初筛(召回优先),真正的判定交给模型;公开信息,CC BY 4.0。
# 匹配方式:不区分大小写,须从词首开始(sewer 能匹配 sewerage;dam 这种短词会误中 damage,不要收);
#           全大写、≤5 个字母的缩写(EOI、GPN、WWTP)按整词、区分大小写匹配;
#           写成 /…/ 的是正则(同样从词首开始),用来排除易混的词,如 '/kanal(?!iz)/' 不算 kanalizasiya。
# 俄语、阿塞拜疆语多写词干(водоснабжен 匹配 водоснабжение/водоснабжения)。
# 命中任一领域的词即算"水务";领域可多选,都没命中具体领域时记为 other。
schema: osint-water/watch-terms@2

sectors:
  water_supply:
    zh: 供水
    en: [water supply, drinking water, potable water, water treatment plant, non-revenue water, water loss, water main,
         water pipeline, transmission main, water transmission, water network, water distribution, water meter, bulk water, water utility,
         water utilities, water treatment, borehole, water well]
