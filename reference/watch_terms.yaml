    # IWP / IWPP:海湾国家海水淡化 PPP 的通称(独立水厂、独立水电联产,如沙特 Sharakat、阿曼 Nama PWP 的项目);
    # 反渗透(SWRO 海水、BWRO 苦咸水)是主流工艺,招标标题常只写工艺不写"海水淡化"
    en: [desalination, desalinat, desalinis, seawater reverse osmosis, reverse osmosis, SWRO, BWRO, IWP, IWPP, brackish water]
