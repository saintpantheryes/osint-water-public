<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>全球水务开源情报 · 城市概况</title>
<link rel="icon" href="favicon.png">
<link rel="stylesheet" href="portal.css">
<script src="echarts.min.js"></script>
<script src="portal.js"></script>
</head>
<body>
<div id="nav"></div>
<script>document.getElementById("nav").innerHTML = P.nav("city.html");  /* 顶栏紧跟着就画,不等读表 */</script>
<main>
  <!-- 两种样子:不带 id 是全部规模以上城市(筛选、地图、清单);带 ?id= 是一座城市(概况、商机、线索) -->
  <section id="list" style="display:none">
    <h1>城市概况</h1>
    <div class="backbar" id="lrel"></div>
    <div class="filters" id="filters">
      <div class="frow"><b>国别</b><select id="fCountry" aria-label="国别"><option value="">全部国别</option></select></div>
      <div class="frow"><b>地图按</b><span id="fBy" class="frow" style="padding:0"></span><span class="muted small" id="rangeNote"></span></div>
      <div class="frow"><b>关联</b><span id="fHas" class="frow" style="padding:0"></span></div>
      <div class="frow"><b>搜索</b><input id="fText" placeholder="搜城市中文名、英文名或行政区" size="30" aria-label="搜城市"><span class="muted" id="fNote" style="margin-left:auto"></span></div>
    </div>
    <div class="cards" id="cards"><div class="card"><div class="n">…</div><div class="l">读取中</div></div></div>
    <h2>分布(拖左下角滑块按<span id="byName">人口</span>筛城市,清单跟着变;颜色越深数越大,红圈是有线索或商机;点圆点看这座城市;滚轮缩放,<a href="#" id="mapReset">复位</a>)</h2>
    <div class="panel"><div id="map" class="chart tall"></div></div>
    <h2 id="listTitle">城市清单</h2>
    <div class="panel" id="rows">读取中…</div>
  </section>
  <section id="one" style="display:none">
    <div class="toolbar"><a href="city.html" id="back">← 全部城市</a><h1 style="margin:0" id="cname"></h1><span class="muted" id="cname2"></span><span id="openRow" style="margin-left:auto"></span></div>
    <div class="backbar" id="rel"></div>
    <div class="cards" id="ccards"></div>
    <div class="tabs" id="tabs"></div>
    <div class="tab" data-t="info"><div class="panel" id="info"></div><div class="panel"><div id="cmap" class="chart"></div></div></div>
    <div class="tab" data-t="opps"><div class="panel" id="opps">读取中…</div></div>
    <div class="tab" data-t="leads"><div class="panel" id="leads">读取中…</div></div>
    <div class="tab" data-t="plants"><div class="panel" id="pmapBox"><div id="pmap" class="chart"></div><p class="muted small" id="pmapNote"></p></div><h2>自来水厂</h2><div class="panel" id="supply">读取中…</div><h2>污水厂</h2><div class="panel" id="sewage">读取中…</div></div>
    <section id="chron"></section>
    <section id="awBox"></section>
  </section>
  <script>document.getElementById(/[?&]id=/.test(location.search) ? "one" : "list").style.display = "";  /* 先露出要的那一种,不等读表 */</script>
</main>
<script>
(async function () {
  const $ = (id) => document.getElementById(id);
  const q0 = new URLSearchParams(location.search);
  const state = { c: q0.get("c") || "", by: q0.get("by") === "gdp" ? "gdp" : "", lo: q0.get("lo") || "", hi: q0.get("hi") || "", h: q0.get("h") || "", q: (q0.get("q") || "").trim() };
  /* 地图左下角的滑块(和国别地图一样):按人口或地区生产总值筛城市。数跨好几个数量级,滑块走对数刻度;lo / hi 是选中的上下限(原值),记在网址里 */
  const BY = [["", "人口"], ["gdp", "生产总值"]];
  const metric = (ct) => { const v = Number(P.get("city", ct, state.by === "gdp" ? "gdp" : "population")); return v > 0 ? v : 0; };
  const fmtBy = (v) => (state.by === "gdp" ? (v >= 1e4 ? (v / 1e4).toFixed(1) + " 万亿美元" : Math.round(v).toLocaleString("zh-CN") + " 亿美元") : people(v));
  const HAS = [["", "全部"], ["lead", "有线索"], ["opp", "有商机"]];
  const SHOW = 300;  // 清单一次列出的城市数(按人口从多到少)
  const num = (v) => (v === undefined || v === null || v === "" ? "" : Number(v).toLocaleString("zh-CN"));
  const people = (n) => (n >= 1e8 ? (n / 1e8).toFixed(2) + " 亿" : n >= 1e4 ? Math.round(n / 1e4).toLocaleString("zh-CN") + " 万" : String(n || 0));
  const latlon = (v) => { const m = String(v || "").match(/(-?\d+(?:\.\d+)?)\s*[,,]\s*(-?\d+(?:\.\d+)?)/); return m ? [Number(m[2]), Number(m[1])] : null; };  // 「纬度,经度」→ [经度, 纬度]
  let countries = [], byId = {}, geoReady = null, bl = new Set();
  const cname = (ct) => P.get("city", ct, "name_zh") || P.get("city", ct, "name_en") || "";
  const nameCell = (ct) => { const zh = cname(ct), en = P.get("city", ct, "name_en");
    return P.raw('<a href="city.html?id=' + encodeURIComponent(ct.id) + '"><b>' + P.esc(zh) + "</b></a>" + (en && en !== zh ? ' <span class="muted small">' + P.esc(en) + "</span>" : "")); };
  const countryOf = (ct) => byId[P.linkId(P.get("city", ct, "country"))];
  const countryCell = (ct) => { const c = countryOf(ct); if (!c) return P.text(P.get("city", ct, "country")) || "";
    return P.raw('<a href="country.html?' + new URLSearchParams({ iso: P.get("country", c, "key"), t: "cities" }) + '">' + P.esc(P.get("country", c, "name_zh") || P.get("country", c, "key")) + "</a>"); };

  function world() {  // 世界地图底图只注册一次
    geoReady = geoReady || Promise.all([fetch("world.geo.json").then((r) => r.json()).then((geo) => echarts.registerMap("world", geo)),
      P.ignored().then((s) => { bl = s; })]);  // 忽略的国别:底图涂灰
    return geoReady;
  }
  function onMap(el, cities, opt) {
    const mc = echarts.init(el);
    const max = Math.max(1, ...cities.map((ct) => Number(P.get("city", ct, "population")) || 0));
    const pt = (ct) => { const xy = latlon(P.get("city", ct, "coords")); if (!xy) return null;
      const lc = Number(P.get("city", ct, "lead_count")) || 0, oc = Number(P.get("city", ct, "opp_count")) || 0;
      const m = opt.range ? metric(ct) : 0;
      return { name: cname(ct), id: ct.id, value: xy.concat([Number(P.get("city", ct, "population")) || 0, lc, oc, m ? Math.log10(m) : -1]),
        itemStyle: Object.assign({ color: opt.range ? undefined : "#1d4ed8" }, lc || oc ? { borderColor: "#dc2626", borderWidth: 2 } : {}) }; };
    const option = {
      animation: false,
      tooltip: { trigger: "item", formatter: (p) => p.data ? "<b>" + P.esc(p.data.name) + "</b><br>人口 " + people(p.data.value[2]) + (state.by === "gdp" && opt.range ? " · 生产总值 " + (p.data.value[5] >= 0 ? fmtBy(Math.pow(10, p.data.value[5])) : "未填") : "") +
        " · 线索 " + p.data.value[3] + " · 商机 " + p.data.value[4] + (opt.click ? '<br><span class="muted">点一下看这座城市</span>' : "") : "" },
      visualMap: opt.range ? { type: "continuous", dimension: 5, seriesIndex: 0, min: opt.range.min, max: opt.range.max, range: opt.range.sel, calculable: true, realtime: true,
        text: [state.by === "gdp" ? "生产总值高" : "人口多", "少"], formatter: (v) => fmtBy(Math.pow(10, v)), left: 10, bottom: 10,
        inRange: { color: ["#93c5fd", "#1e3a8a"] }, outOfRange: { color: "#cbd5e1", opacity: 0.25 } } : undefined,
      geo: { map: "world", roam: true, center: opt.center, zoom: opt.zoom || 1.1, itemStyle: { areaColor: "#f1f5f9", borderColor: "#cbd5e1" }, emphasis: { disabled: true }, label: { show: false }, regions: P.hatchRegions(bl) },
      series: [{ type: "scatter", coordinateSystem: "geo", data: cities.map(pt).filter(Boolean), symbolSize: (v) => 4 + 18 * Math.sqrt(v[2] / max), itemStyle: { opacity: 0.75 } }],
    };
    mc.setOption(option);
    P.hatchNote(el, bl);
    if (opt.click) mc.on("click", (p) => { if (p.data && p.data.id) location.href = "city.html?id=" + encodeURIComponent(p.data.id); });
    let rt = 0; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => mc.resize(), 150); });
    return { mc, option };
  }

  /* ---------- 全部城市 ---------- */
  async function list() {
    const all = await P.records("city", { orderBy: [{ fieldId: P.f("city", "population"), order: "desc" }],
      props: ["name_zh", "name_en", "country", "admin", "coords", "population", "area_km2", "density", "gdp", "gdp_year", "lead_count", "opp_count", "supply_count", "sewage_count"] });
    const plantCols = P.has("city", "supply_count");  // 水厂表建了才有这两列
    all.sort((x, y) => (Number(P.get("city", y, "population")) || 0) - (Number(P.get("city", x, "population")) || 0));  // 人口从多到少(四千多行分页读,页与页之间也按这个)
    const used = new Set(all.map((ct) => P.linkId(P.get("city", ct, "country"))));
    P.fillCountrySelect($("fCountry"), countries.filter((c) => used.has(c.id)).map((c) => [P.get("country", c, "key"), P.get("country", c, "name_zh") || P.get("country", c, "key")]));
    $("fCountry").value = state.c;
    let map = null;
    const draw = () => {
      const iso = state.c, words = state.q.toLowerCase();
      const base = all.filter((ct) => {
        const c = countryOf(ct);
        if (iso && (!c || P.get("country", c, "key") !== iso)) return false;
        if (state.h === "lead" && !(Number(P.get("city", ct, "lead_count")) > 0)) return false;
        if (state.h === "opp" && !(Number(P.get("city", ct, "opp_count")) > 0)) return false;
        if (words && ![cname(ct), P.get("city", ct, "name_en"), P.get("city", ct, "admin")].some((x) => String(x || "").toLowerCase().includes(words))) return false;
        return true;
      });
      /* 滑块的两端:这批城市里有数的最小、最大值(对数);生产总值大多还没填,没填的不在范围里 */
      const logs = base.map(metric).filter((v) => v > 0).map((v) => Math.log10(v));
      const range = logs.length ? { min: Math.floor(Math.min(...logs) * 10) / 10, max: Math.ceil(Math.max(...logs) * 10) / 10 } : null;
      if (range && range.max <= range.min) range.max = range.min + 0.1;
      if (range) {
        const lo = Number(state.lo) > 0 ? Math.max(range.min, Math.log10(Number(state.lo))) : range.min, hi = Number(state.hi) > 0 ? Math.min(range.max, Math.log10(Number(state.hi))) : range.max;
        range.sel = [Math.min(lo, hi), Math.max(lo, hi)];
      }
      $("byName").textContent = state.by === "gdp" ? "生产总值" : "人口";
      $("rangeNote").textContent = state.by === "gdp" ? "(生产总值在城市表里人补,现有 " + logs.length + " 座城市填了)" : "";
      if (map) map.mc.dispose();
      const one = iso && countries.find((c) => P.get("country", c, "key") === iso);
      $("lrel").innerHTML = one ? P.marketLinks(iso, P.get("country", one, "name_zh") || iso, "city.html") : "";
      const pts = base.map((ct) => latlon(P.get("city", ct, "coords"))).filter(Boolean);
      const center = one && pts.length ? [pts.reduce((s, p) => s + p[0], 0) / pts.length, pts.reduce((s, p) => s + p[1], 0) / pts.length] : undefined;
      map = onMap($("map"), base, { click: true, center, zoom: center ? 4 : 1.1, range });
      let rt = 0;
      map.mc.on("datarangeselected", (e) => { clearTimeout(rt); rt = setTimeout(() => {
        const a = Math.max(range.min, e.selected[0]), b = Math.min(range.max, e.selected[1]), full = range && a <= range.min + 1e-9 && b >= range.max - 1e-9;
        state.lo = full ? "" : String(Math.round(Math.pow(10, a))); state.hi = full ? "" : String(Math.round(Math.pow(10, b)));
        fill(base, range ? [a, b] : null);
      }, 120); });
      fill(base, range && range.sel);
    };
    /* 清单与卡片:基本筛选之后,再按滑块选中的范围 */
    const fill = (base, sel) => {
      const rows = !sel ? (state.by === "gdp" ? [] : base) : base.filter((ct) => { const v = metric(ct); if (!v) return false; const l = Math.log10(v); return l >= sel[0] - 1e-9 && l <= sel[1] + 1e-9; });
      $("rangeNote").dataset.sel = sel ? fmtBy(Math.pow(10, sel[0])) + " ~ " + fmtBy(Math.pow(10, sel[1])) : "";
      const qs = new URLSearchParams(Object.entries(state).filter(([, v]) => v)).toString();
      history.replaceState(null, "", "city.html" + (qs ? "?" + qs : ""));
      const pop = rows.reduce((s, ct) => s + (Number(P.get("city", ct, "population")) || 0), 0);
      const n = (f) => rows.filter(f).length;
      $("cards").innerHTML = [[rows.length.toLocaleString("zh-CN"), "城市"], [people(pop), "合计人口"], [n((ct) => Number(P.get("city", ct, "population")) >= 1e6), "百万人口以上"],
        [n((ct) => Number(P.get("city", ct, "lead_count")) > 0), "有线索的城市"], [n((ct) => Number(P.get("city", ct, "opp_count")) > 0), "有商机的城市"]]
        .map(([v, l]) => '<div class="card"><div class="n">' + v + '</div><div class="l">' + l + "</div></div>").join("");
      $("fNote").textContent = all.length ? "共 " + all.length.toLocaleString("zh-CN") + " 座" : "";
      $("listTitle").textContent = "城市清单(" + ($("rangeNote").dataset.sel && (state.lo || state.hi) ? ($("byName").textContent + " " + $("rangeNote").dataset.sel + ",") : "") + "按人口从多到少" + (rows.length > SHOW ? ",列出前 " + SHOW + " 座,筛选或搜索看其余的" : "") + ")";
      $("rows").innerHTML = !rows.length ? '<p class="muted">没有符合条件的城市。</p>' :
        P.tableHtml(["城市", "国别", "行政区", "人口", "面积(km²)", "密度", "生产总值(亿美元)", "线索", "商机"].concat(plantCols ? ["自来水厂", "污水厂"] : []), rows.slice(0, SHOW).map((ct) => { const g = (p) => P.get("city", ct, p);
          return [nameCell(ct), countryCell(ct), g("admin") || "", num(g("population")), num(g("area_km2")), num(g("density")),
            P.raw(P.esc(num(g("gdp"))) + (g("gdp") && g("gdp_year") ? ' <span class="muted small">' + P.esc(String(g("gdp_year"))) + "</span>" : "")), String(g("lead_count") || 0), String(g("opp_count") || 0)]
            .concat(plantCols ? [String(g("supply_count") || 0), String(g("sewage_count") || 0)] : []); }));
    };
    P.chips($("fBy"), BY, state, "by", () => { state.lo = state.hi = ""; draw(); });
    P.chips($("fHas"), HAS, state, "h", draw);
    $("fCountry").onchange = () => { state.c = $("fCountry").value; draw(); };
    $("fText").value = state.q;
    let tt = 0; $("fText").oninput = () => { clearTimeout(tt); tt = setTimeout(() => { state.q = $("fText").value.trim(); draw(); }, 250); };
    $("mapReset").onclick = (e) => { e.preventDefault(); if (map) { map.mc.clear(); map.mc.setOption(map.option); } };
    if (!all.length) {
      $("cards").innerHTML = ""; $("map").parentNode.style.display = "none";
      $("rows").innerHTML = '<p class="muted">城市表已经建好,还没有数据:后台每月按 GeoNames 公开数据把人口 10 万以上的城市建进来,第一次在下一轮自动任务里补上(最晚第二天早上)。</p>';
      return;
    }
    try { await world(); } catch (e) { $("map").innerHTML = '<p class="muted">地图没画出来:' + P.esc(e.message) + "</p>"; }
    draw();
  }

  /* ---------- 一座城市 ---------- */
  async function one(id) {
    const PLANT = ["name", "name_zh", "kind", "status", "capacity", "pop_served", "built", "level", "process", "upgrades", "operator", "coords", "source"];
    const plantsOf = (oid) => P.has(oid, "city") ? P.records(oid, { filter: P.and(P.cond(oid, "city", "is", id)), orderBy: [{ fieldId: P.f(oid, "capacity"), order: "desc" }], props: PLANT }) : Promise.resolve(null);
    const listsP = Promise.all([  // 这几张清单只要城市编号:与读整条城市记录同时发出,不排队
      P.has("opportunity", "city") ? P.records("opportunity", { filter: P.and(P.cond("opportunity", "city", "is", id)), props: ["code", "name_zh", "stage", "public_stage", "next_milestone", "owner", "financing", "size_value", "currency", "size_cny"] }) : Promise.resolve([]),
      P.has("lead", "city") ? P.records("lead", { filter: P.and(P.cond("lead", "city", "is", id)), take: 200, orderBy: [{ fieldId: P.f("lead", "found_at"), order: "desc" }],
        props: ["key", "title", "url", "category", "published", "found_at", "nearest_deadline", "summary_zh", "project_name", "opportunity", "status"] }) : Promise.resolve([]),
      plantsOf("supply_plant"), plantsOf("sewage_plant"),
    ]);
    P.chronicle($("chron"), "city", id).catch((e) => P.fail($("chron"), e));  /* 水务大事记(在已中标项目上面) */
    P.awards($("awBox"), "city", id).catch((e) => P.fail($("awBox"), e));  /* 已中标项目(页面最下面) */
    const full = await P.api("/table/" + P.t("city").id + "/record/" + id, { fieldKeyType: "id" });
    if (!full || !full.fields) { $("info").innerHTML = '<div class="err">没有这座城市</div>'; return; }
    const ct = full, g = (p) => P.get("city", ct, p), c = countryOf(ct);
    $("cname").textContent = cname(ct);
    if (g("name_en") && g("name_en") !== cname(ct)) $("cname2").textContent = g("name_en");
    document.title = "全球水务开源情报 · " + cname(ct);
    const iso = c ? P.get("country", c, "key") : "", cnm = c ? P.get("country", c, "name_zh") || iso : "";
    P.backLink($("back"), iso ? "city.html?" + new URLSearchParams({ c: iso }) : "city.html", iso ? cnm + "全部城市" : "全部城市");
    $("rel").innerHTML = P.marketLinks(iso, cnm);
    $("openRow").innerHTML = P.open("city", id, "在表格里打开城市 ↗");
    const [opps, leads, supply, sewage] = await listsP;
    /* 水厂:规模从大到小;改造扩建一行一次,原样分行显示 */
    const plantTable = (oid, list, empty) => {
      if (list === null) return '<p class="muted">「' + empty + '」表还没建(跑一次建表命令后这里就有)。</p>';
      if (!list.length) return '<p class="muted">还没有' + empty + '挂在这座城市。</p>';
      list.sort((a, b) => (Number(P.get(oid, b, "capacity")) || 0) - (Number(P.get(oid, a, "capacity")) || 0));
      const lvl = oid === "sewage_plant";
      return P.tableHtml(["名称", "类型", "状态", "规模(万吨/日)", "服务人口", "建设时间"].concat(lvl ? ["处理级别"] : [], ["工艺", "改造扩建", "运营方", ""]), list.map((x) => { const q = (p) => P.get(oid, x, p);
        const nm = q("name_zh") ? "<b>" + P.esc(q("name_zh")) + '</b> <span class="muted small">' + P.esc(q("name") || "") + "</span>" : "<b>" + P.esc(q("name") || "") + "</b>";
        return [P.raw(nm), q("kind"), q("status"), num(q("capacity")), num(q("pop_served")), q("built") || ""].concat(lvl ? [q("level") || ""] : [],
          [q("process") || "", P.raw(String(q("upgrades") || "").split(/\r?\n/).filter(Boolean).map(P.esc).join("<br>")), q("operator") || "", P.raw(P.open(oid, x.id))]); }));
    };
    $("supply").innerHTML = plantTable("supply_plant", supply, "自来水厂");
    $("sewage").innerHTML = plantTable("sewage_plant", sewage, "污水厂");
    const nPlants = (supply || []).length + (sewage || []).length;
    $("ccards").innerHTML = [[people(Number(g("population")) || 0), "人口" + (g("pop_year") ? "(" + g("pop_year") + ")" : "")], [num(g("area_km2")) || "—", "面积(km²)"], [num(g("density")) || "—", "密度(人/km²)"],
      [num(g("gdp")) || "—", "生产总值(亿美元)" + (g("gdp_year") ? "(" + g("gdp_year") + ")" : "")], [opps.length, "商机"], [leads.length + (leads.length >= 200 ? "+" : ""), "线索"]]
      .map(([v, l]) => '<div class="card"><div class="n">' + P.esc(String(v)) + '</div><div class="l">' + P.esc(l) + "</div></div>").join("");
    const kv = [["所属国别", c ? countryCell(ct).__html : P.esc(P.text(g("country")))], ["所在行政区", P.esc(g("admin") || "")], ["坐标", P.esc(g("coords") || "")],
      ["现行水价", g("tariff") != null && g("tariff") !== "" ? P.esc(String(g("tariff")) + " " + (g("tariff_currency") || "") + "/立方米") : ""], ["最近调价", P.esc(P.day(g("tariff_changed")) || "")],
      ["水价说明", P.esc(g("tariff_note") || "").replace(/\r?\n/g, "<br>")], ["水价来源", P.esc(g("tariff_source") || "")],
      ["数据来源", P.esc(g("source") || "")], ["备注", P.esc(g("note") || "")]].filter(([, v]) => v);
    $("info").innerHTML = '<div class="facts">' + kv.map(([k, v]) => "<div><b>" + k + "</b><span>" + v + "</span></div>").join("") + "</div>" +
      (P.riskFacts("city", ct, iso) ? '<h3>水风险与经济(趋势参考)</h3>' + P.riskFacts("city", ct, iso) : "") +
      '<p class="muted small">面积、地区生产总值、水价公开数据里没有,在城市表里补上就显示,密度随后自动算。线索、商机的「城市」一栏由人选,选上了就出现在这里。</p>';
    $("opps").innerHTML = !opps.length ? '<p class="muted">还没有商机关联到这座城市。</p>' :
      P.tableHtml(["编号", "名称", "我方阶段", "投资规模", "负责人", "公开进度", "下一节点", ""], opps.map((o) => { const q = (p) => P.get("opportunity", o, p);
        return [P.raw('<a href="' + P.oppUrl(o.id) + '">' + P.esc(q("code") || "") + "</a>"), q("name_zh"), q("stage") || "建议", P.sizeText("opportunity", o), P.text(q("owner")), q("public_stage"), q("next_milestone"), P.raw(P.open("opportunity", o.id))]; }));
    $("leads").innerHTML = !leads.length ? '<p class="muted">还没有线索关联到这座城市。</p>' :
      P.tableHtml(["标题", "类别", "发布", "最近截止", "所属商机", "处理状态", ""], leads.slice(0, 100).map((l) => { const q = (p) => P.get("lead", l, p);
        return [P.titleCell(l), q("category"), P.day(q("published")) || P.day(q("found_at")), q("nearest_deadline"), P.text(q("opportunity")), q("status"), P.raw(P.open("lead", l.id))]; }));
    const TABS = [["info", "概况"], ["opps", "商机 <b>" + opps.length + "</b>"], ["leads", "线索 <b>" + leads.length + (leads.length >= 200 ? "+" : "") + "</b>"], ["plants", "水厂 <b>" + nPlants + "</b>"]];
    let tab = TABS.some(([k]) => k === q0.get("t")) ? q0.get("t") : "info";
    const showTab = (k) => {
      tab = k;
      $("tabs").querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.t === k));
      document.querySelectorAll(".tab").forEach((d) => d.classList.toggle("on", d.dataset.t === k));
      history.replaceState(null, "", "city.html?" + new URLSearchParams({ id, t: k }));
      if (k === "info" && cmap) cmap.mc.resize();
    };
    $("tabs").innerHTML = TABS.map(([k, l]) => '<button type="button" data-t="' + k + '">' + l + "</button>").join("");
    $("tabs").querySelectorAll("button").forEach((b) => { b.onclick = () => showTab(b.dataset.t); });
    let cmap = null, pmap = null;
    /* 水厂地图:城市为灰点,自来水厂蓝、污水厂绿,点大小按规模;范围按这些水厂的坐标自动放大 */
    const drawPlants = async () => {
      const pts = [["supply_plant", supply, "#2563eb", "自来水厂"], ["sewage_plant", sewage, "#16a34a", "污水厂"]].map(([oid, list, color, label]) => ({ color, label,
        data: (list || []).map((x) => { const xy = latlon(P.get(oid, x, "coords")); return xy && { name: P.get(oid, x, "name_zh") || P.get(oid, x, "name") || "", kind: P.get(oid, x, "kind") || label,
          value: xy.concat([Number(P.get(oid, x, "capacity")) || 0]) }; }).filter(Boolean) }));
      const n = pts[0].data.length + pts[1].data.length, cxy = latlon(g("coords"));
      if (!n) { $("pmapBox").style.display = "none"; return; }
      $("pmapNote").textContent = "共 " + n + " 座有坐标" + (n < nPlants ? "(另有 " + (nPlants - n) + " 座没坐标,只在下面表里)" : "") + "。点越大规模越大,滚轮缩放、拖动平移。";
      const all = pts[0].data.concat(pts[1].data).map((d) => d.value).concat(cxy ? [cxy] : []);
      const lons = all.map((v) => v[0]), lats = all.map((v) => v[1]);
      const span = Math.max(Math.max(...lons) - Math.min(...lons), Math.max(...lats) - Math.min(...lats), 0.15);
      const maxCap = Math.max(1, ...all.map((v) => v[2] || 0));
      try { await world(); } catch (e) { $("pmap").innerHTML = '<p class="muted">地图没画出来:' + P.esc(e.message) + "</p>"; return; }
      const mc = echarts.init($("pmap"));
      mc.setOption({ animation: false, legend: { top: 6, left: 10, data: pts.filter((p) => p.data.length).map((p) => p.label) },
        tooltip: { trigger: "item", formatter: (p) => p.data ? "<b>" + P.esc(p.data.name) + "</b><br>" + P.esc(p.data.kind || "") + (p.data.value[2] ? " · " + p.data.value[2] + " 万吨/日" : "") : "" },
        geo: { map: "world", roam: true, center: [(Math.max(...lons) + Math.min(...lons)) / 2, (Math.max(...lats) + Math.min(...lats)) / 2], zoom: Math.min(400, 300 / (span * 1.4)),
          itemStyle: { areaColor: "#f1f5f9", borderColor: "#cbd5e1" }, emphasis: { disabled: true }, label: { show: false }, regions: P.hatchRegions(bl) },
        series: [{ name: "城市", type: "scatter", coordinateSystem: "geo", data: cxy ? [{ name: cname(ct), kind: "城市中心", value: cxy.concat([0]) }] : [], symbol: "diamond", symbolSize: 12, itemStyle: { color: "#64748b" }, z: 1 }]
          .concat(pts.map((p) => ({ name: p.label, type: "scatter", coordinateSystem: "geo", data: p.data, symbolSize: (v) => 6 + 18 * Math.sqrt((v[2] || 0) / maxCap), itemStyle: { color: p.color, opacity: 0.8 }, z: 2 }))) });
      pmap = mc;
    };
    const showPlants = (k) => { if (k !== "plants") return; if (pmap) pmap.resize(); else drawPlants(); };
    $("tabs").querySelectorAll("button").forEach((b) => b.addEventListener("click", () => showPlants(b.dataset.t)));
    showTab(tab);
    showPlants(tab);
    const xy = latlon(g("coords"));
    if (xy) { try { await world(); cmap = onMap($("cmap"), [ct], { center: xy, zoom: 6 }); } catch (e) { $("cmap").innerHTML = '<p class="muted">地图没画出来:' + P.esc(e.message) + "</p>"; } }
    else $("cmap").parentNode.style.display = "none";
  }

  try {
    await P.load();
    if (!(P.cfg.tables && P.cfg.tables.city)) {
      $("one").style.display = "none"; $("list").style.display = ""; $("cards").innerHTML = ""; $("map").parentNode.style.display = "none";
      $("rows").innerHTML = '<p class="muted">「城市」表还没建(跑一次建表命令后这里就有)。</p>';
      return;
    }
    [countries] = await Promise.all([P.countries(), P.zhTerms()]);  // 两样互不依赖,同时取
    countries.forEach((c) => { byId[c.id] = c; });
    const id = q0.get("id");
    if (id) await one(id); else await list();
  } catch (e) { P.fail($(q0.get("id") ? "info" : "rows"), e); }
})();
</script>
</body>
</html>
