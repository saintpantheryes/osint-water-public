<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>全球水务开源情报 · 商机工作台</title>
<link rel="icon" href="favicon.png">
<link rel="stylesheet" href="portal.css">
<script src="portal.js"></script>
</head>
<body>
<div id="nav"></div>
<script>document.getElementById("nav").innerHTML = P.nav("opps.html");  /* 顶栏紧跟着就画,不等读表 */</script>
<main>
  <div id="head"><p class="muted">读取中…</p></div>
  <div id="arc"></div>
  <div class="two">
    <div class="col">
      <div class="panel form" id="fuForm">
        <h3>记一笔跟进</h3>
        <div class="row"><label>日期</label><input type="date" id="fuDay"></div>
        <div class="row"><label>内容 *</label><textarea id="fuContent" rows="3" placeholder="做了什么、了解到什么"></textarea></div>
        <div class="row"><label>判断</label><select id="fuJudg"><option value="">(不填)</option></select></div>
        <div class="row"><label>判断依据</label><input id="fuReason"></div>
        <div class="row"><label>下一步</label><input id="fuNext" placeholder="下一步做什么"></div>
        <div class="row"><label>到期</label><input type="date" id="fuDue"></div>
        <div class="row"><label>阶段改为</label><select id="fuStage"><option value="">(不改)</option></select></div>
        <div class="row"><label></label><button id="fuSave" class="primary">保存跟进</button><span class="muted" id="fuMsg"></span></div>
      </div>
      <div class="panel form" id="rpForm">
        <h3>要一份报告</h3>
        <div class="row"><label>类型</label><select id="rpKind"><option value="项目报告">项目报告(这个商机)</option><option value="国别报告">国别报告(所在国)</option></select></div>
        <div class="row"><label>版本</label><select id="rpEd"><option value="内部版">内部版</option><option value="公开版">公开版</option></select></div>
        <div class="row"><label></label><button id="rpSave">排队生成</button><span class="muted" id="rpMsg"></span></div>
        <p class="muted">后台 2 分钟内生成 Word,出现在下方「报告」里。</p>
      </div>
      <div class="panel form" id="quick">
        <h3>负责与优先级</h3>
        <div class="row"><label>负责人</label><span id="ownerNow"></span><button id="mine">我来负责</button></div>
        <div class="row"><label>优先级</label><select id="prio"><option value="">(未定)</option><option>A</option><option>B</option><option>C</option></select></div>
        <div class="row"><label>内部备注</label><textarea id="note" rows="2"></textarea></div>
        <div class="row"><label></label><button id="quickSave">保存</button><span class="muted" id="quickMsg"></span></div>
      </div>
    </div>
    <div class="col wide">
      <div id="review"></div>
      <h2>跟进时间线</h2>
      <div id="timeline" class="panel">读取中…</div>
      <h2>时间节点</h2>
      <div id="ms" class="panel"></div>
      <h2>项目情况(机器整理,人可在表格里改)</h2>
      <div id="facts"></div>
      <h2>所属线索</h2>
      <div id="leads" class="panel"></div>
      <h2>报告</h2>
      <div id="reports" class="panel"></div>
    </div>
  </div>
</main>
<script>
(async function () {
  const $ = (id) => document.getElementById(id);
  const rid = new URLSearchParams(location.search).get("id");
  let opp = null, me = null, countryName = "", canWrite = false;
  const g = (p) => P.get("opportunity", opp, p);
  const lines = (v) => String(v || "").split(/\r?\n/).map((x) => x.trim()).filter(Boolean);
  let numOf = {}, cinfo = {};  // 出处角标:[8位线索号] → 序号 + 可点开的线索
  const cites = (txt) => P.cites(txt, numOf, cinfo);
  async function resolveCites() {
    const keys = P.citeKeys(["scope", "financing", "packages", "owner_org", "parties", "ai_reason", "pending", "review_updates"].map(g));
    numOf = {}; keys.forEach((k, i) => { numOf[k] = i + 1; });
    try { cinfo = keys.length ? await P.leadsByKeys(keys) : {}; } catch (e) { cinfo = {}; }
  }
  const list = (v) => { const ls = lines(v); return ls.length ? '<ul class="notes">' + ls.map((l) => "<li>" + cites(l) + "</li>").join("") + "</ul>" : ""; };
  const sec = (label, html, open) => html ? '<details class="sec"' + (open ? " open" : "") + "><summary>" + label + '</summary><div class="panel">' + html + "</div></details>" : "";

  async function loadOpp() {
    const r = await P.api("/table/" + P.t("opportunity").id + "/record/" + rid, { fieldKeyType: "id" });
    if (!r) return;
    opp = r;
    const stage = g("stage") || "建议";
    document.title = "全球水务开源情报 · " + (g("code") || "") + " " + (g("name_zh") || "");
    $("head").innerHTML = '<div class="opphead"><div><a href="opps.html" class="muted">‹ 商机总览</a><h1>' + P.esc(g("code") || "") + " " + P.esc(g("name_zh") || "") +
      " " + P.stageTag(stage) + (P.isArchived(opp) ? " " + P.tagHtml("已归档", "", "放弃跟踪") : "") + "</h1>" +
      '<p class="muted">' + [g("name_local"), countryName ? '<a href="country.html?iso=' + encodeURIComponent(countryName.iso) + '">' + P.esc(countryName.zh) + "</a>" : "", P.text(g("city")) ? P.esc(P.text(g("city"))) : "", g("location"), g("priority") ? "优先级 " + P.esc(g("priority")) : "", P.text(g("owner")) ? "负责人 " + P.esc(P.text(g("owner"))) : "未定负责人"].filter(Boolean).join(" · ") + "</p></div>" +
      P.factsHtml([["公开进度", g("public_stage") || "—", { note: g("public_stage_note") || "" }], ["下一节点", g("next_milestone") || "—"],
        ["下一步", (g("next_step") || "—") + (g("next_due") ? " · 到期 " + P.day(g("next_due")) : "")], ["当前判断", g("judgment") || "—"],
        ["投资规模", P.sizeText("opportunity", r) || (g("size_usd") ? "≈ " + Number(g("size_usd")).toLocaleString() + " 美元" : "—")],
        ["投标资格", g("eligibility") || "—", { note: g("eligibility_basis") || "" }], ["最晚启动", P.day(g("latest_start")) || "—"]]) +
      '<p class="muted">' + P.open("opportunity", rid, "在表格里打开这个商机 ↗") + "</p></div>";
    renderArchive();
    $("ownerNow").textContent = P.text(g("owner")) || "(未定)";
    $("prio").value = g("priority") || "";
    $("note").value = g("internal_note") || "";
    await resolveCites();
    $("review").innerHTML = g("review_updates") ? '<div class="note n-warn"><b>机器发现的待核更新</b>(与表里已有值不同,请核后在表格里改)' + list(g("review_updates")) + "</div>" : "";
    $("facts").innerHTML = sec("建设内容与规模", g("scope") ? "<p>" + cites(g("scope")) + "</p>" : "", true) + sec("资金", list(g("financing")), true) + sec("标段", list(g("packages")), false) +
      sec("业主与执行机构", g("owner_org") ? "<p>" + cites(g("owner_org")) + "</p>" : "", false) + sec("参与方", list(g("parties")), false) + sec("建议理由(机器)", g("ai_reason") ? "<p>" + cites(g("ai_reason")) + "</p>" : "", false) +
      sec("待核实", list(g("pending")), false) + sec("别名与外部编号", list(g("aliases")) + list(g("external_ids")), false) + P.citeNote(numOf, cinfo);
  }

  /* 放弃跟踪 / 归档(本体 A50,glossary.archived_opp):在跟踪的四档 → 「放弃跟踪」(阶段改「放弃」+ 勾已归档);已结束的未中标、放弃 → 「归档」(只勾已归档);
     已归档的顶上一条说明(日期、原因)和「恢复跟踪」(去掉已归档,「放弃」的改回「跟踪中」)。每次都留一条跟进,不删、所属线索不动。表里还没这几个字段(没跑建表)时不显示 */
  function renderArchive() {
    const el = $("arc"); el.innerHTML = "";
    if (!P.has("opportunity", "archived") || !canWrite) return;
    const stage = g("stage") || "建议", tracked = P.TRACKED.includes(stage), decided = P.DECIDED.includes(stage);
    if (P.isArchived(opp)) {
      el.innerHTML = '<div class="note n-warn arc-box"><div><b>这个商机已归档</b>(放弃跟踪' + (P.day(g("archived_at")) ? " · " + P.day(g("archived_at")) : "") + ")" + (g("archive_reason") ? ":" + P.esc(g("archive_reason")) : "") +
        '<br><span class="muted small">商机总览、日历、首页与助手默认不算它;所属线索、跟进、报告都还在。</span></div><button type="button" class="btn primary" id="arcUndo">恢复跟踪</button></div>';
      $("arcUndo").onclick = () => archive(false);
      return;
    }
    if (!decided) return;  // AI 推荐、不跟进的在「线索处理」那一步定,这里不归档
    el.innerHTML = '<div class="arc-act"><button type="button" class="btn ' + (tracked ? "danger" : "primary") + '" id="arcGo">' + (tracked ? "放弃跟踪" : "归档这个商机") + "</button>" +
      '<span class="muted small">' + (tracked ? "阶段改为「放弃」并归档:商机总览、日历、首页默认不再算它;不删,所属线索、跟进都还在,可以恢复。" : "已结束的商机归档后商机总览默认不再列它;不删,可以恢复。") + "</span></div>";
    $("arcGo").onclick = () => {
      el.innerHTML = '<div class="note n-warn arc-box"><div><b>确定' + (tracked ? "放弃跟踪" : "归档") + "「" + P.esc(g("code") || "") + " " + P.esc(g("name_zh") || "") + '」?</b><br><label class="small">原因(可不写)<br><input id="arcWhy" placeholder="比如:业主改为本国预算建设,不再国际招标"></label></div>' +
        '<span class="arc-btns"><button type="button" class="btn danger" id="arcYes">确定' + (tracked ? "放弃" : "归档") + '</button><button type="button" class="btn" id="arcNo">取消</button></span></div>';
      $("arcWhy").focus();
      $("arcNo").onclick = renderArchive;
      $("arcYes").onclick = () => archive(true, $("arcWhy").value.trim(), tracked);
    };
  }
  async function archive(on, why, wasTracked) {
    const btns = [...$("arc").querySelectorAll("button")]; btns.forEach((b) => { b.disabled = true; });
    try {
      const stage = g("stage") || "建议", today = P.today();
      const values = on ? { archived: true, archive_reason: why || "", archived_at: today } : { archived: false };
      let newStage = "";
      if (on && wasTracked) newStage = "放弃";
      if (!on && stage === "放弃") newStage = P.TRACKED[0];
      if (newStage) values.stage = newStage;
      await P.patch("opportunity", rid, values);
      await P.create("followup", { opportunity: rid, day: today, author: me && me.id, content: on ? "放弃跟踪,归档" + (why ? ":" + why : "") : "恢复跟踪(取消归档)", stage_change: newStage || "" });
      P.toast(on ? "已归档" + (newStage ? ",阶段改为「放弃」" : "") : "已恢复" + (newStage ? ",阶段改回「" + newStage + "」" : ""));
      await Promise.all([loadOpp(), loadLists()]);
    } catch (e) { P.toast(e.message, true); btns.forEach((b) => { b.disabled = false; }); }
  }

  async function loadLists() {
    const today = P.today();
    const [fus, ms, leads, rps] = await Promise.all([
      P.records("followup", { filter: P.and(P.cond("followup", "opportunity", "is", rid)), orderBy: [{ fieldId: P.f("followup", "day"), order: "desc" }],
        props: ["day", "author", "content", "judgment", "reason", "stage_change", "next_step", "next_due", "attachments"] }),
      P.records("milestone", { filter: P.and(P.cond("milestone", "opportunity", "is", rid)), orderBy: [{ fieldId: P.f("milestone", "day"), order: "asc" }], props: ["kind", "day", "status", "label", "lead"] }),
      P.records("lead", { filter: P.and(P.cond("lead", "opportunity", "is", rid)), take: 100, orderBy: [{ fieldId: P.f("lead", "found_at"), order: "desc" }], props: P.leadTitleProps().concat(["category", "published", "found_at", "status"], P.deadlineProps(), P.has("lead", "archived") ? ["archived", "archive_reason"] : []) }),
      P.records("report", { filter: P.and(P.cond("report", "opportunity", "is", rid)), orderBy: [{ fieldId: P.f("report", "day"), order: "desc" }], props: ["kind", "day", "edition", "gen_status", "file", "requested_by"] }),
    ]);
    const f = (r, p) => P.get("followup", r, p);
    $("timeline").innerHTML = fus.length ? '<ul class="tl">' + fus.map((r) => "<li><div class=\"when\">" + P.day(f(r, "day")) + " · " + P.esc(P.text(f(r, "author")) || "—") + "</div>" +
      (f(r, "stage_change") ? '<span class="tag">阶段 → ' + P.esc(f(r, "stage_change")) + "</span>" : "") + (f(r, "judgment") ? '<span class="tag t-ok">' + P.esc(f(r, "judgment")) + "</span>" : "") +
      "<div>" + P.esc(f(r, "content") || "") + "</div>" + (f(r, "reason") ? '<div class="muted">依据:' + P.esc(f(r, "reason")) + "</div>" : "") +
      (f(r, "next_step") ? '<div class="muted">下一步:' + P.esc(f(r, "next_step")) + (f(r, "next_due") ? "(到期 " + P.day(f(r, "next_due")) + ")" : "") + "</div>" : "") +
      ((f(r, "attachments") || []).length ? "<div>" + (f(r, "attachments") || []).map((a) => '<a href="' + P.esc(P.fileUrl(a)) + '" target="_blank" rel="noopener">' + P.esc(a.name) + "</a>").join(" · ") + "</div>" : "") +
      "<div>" + P.open("followup", r.id, "在表格里打开(补附件)") + "</div></li>").join("") + "</ul>" : '<p class="empty">还没有跟进。左边记第一笔。</p>';
    const m = (r, p) => P.get("milestone", r, p);
    const up = ms.filter((r) => P.day(m(r, "day")) >= today), past = ms.filter((r) => P.day(m(r, "day")) < today);
    const mrow = (r) => [P.day(m(r, "day")), m(r, "kind"), m(r, "status"), m(r, "label"), P.text(m(r, "lead")), P.raw(P.open("milestone", r.id))];
    $("ms").innerHTML = "<b>未来</b>" + P.tableHtml(["日期", "类型", "状态", "说明", "出处线索", ""], up.map(mrow)) + (past.length ? '<details class="sec"><summary>已过去的 ' + past.length + " 个</summary>" + P.tableHtml(["日期", "类型", "状态", "说明", "出处线索", ""], past.reverse().map(mrow)) + "</details>" : "");
    const l = (r, p) => P.get("lead", r, p);
    /* 所属线索全列:有效的在上;已归档(过期)的在下面单独一段,不藏(使用方 10-20:判断商机要看全貌) */
    const lrow = (r) => [l(r, "key"), l(r, "category"), P.titleCell(r),  // 标题与各清单一致:中文在前,原题小字
      P.day(l(r, "published")) || P.day(l(r, "found_at")), P.deadlineCell(r), l(r, "status"), P.raw(P.open("lead", r.id))];
    const live = leads.filter((r) => l(r, "archived") !== true), arc = leads.filter((r) => l(r, "archived") === true);
    $("leads").innerHTML = (live.length || !arc.length ? P.tableHtml(["线索号", "类别", "标题", "发布", "截止", "处理状态", ""], live.map(lrow)) : '<p class="muted small">有效线索 0 条,都已归档。</p>') +
      (arc.length ? '<h3 class="muted">已归档 ' + arc.length + " 条(" + P.ARC_WHY + ")</h3>" + P.tableHtml(["线索号", "类别", "标题", "发布", "截止", "处理状态", "归档原因"], arc.map((r) => lrow(r).slice(0, 6).concat([l(r, "archive_reason") || "已归档"]))) : "");
    const p = (r, k) => P.get("report", r, k);
    $("reports").innerHTML = P.tableHtml(["日期", "类型", "版本", "状态", "发起人", "文件", ""], rps.map((r) => [P.day(p(r, "day")), p(r, "kind"), p(r, "edition"), p(r, "gen_status"), P.text(p(r, "requested_by")),
      P.raw((p(r, "file") || []).map((a) => '<a href="' + P.esc(P.fileUrl(a)) + '" target="_blank" rel="noopener">' + P.esc(a.name) + "</a>").join("<br>")), P.raw(P.open("report", r.id))]));
  }

  async function saveFollowup() {
    const content = $("fuContent").value.trim();
    if (!content) { P.toast("内容不能为空", true); $("fuContent").focus(); return; }
    const btn = $("fuSave"); btn.disabled = true; $("fuMsg").textContent = "保存中…";
    try {
      const stage = $("fuStage").value;
      await P.create("followup", { opportunity: rid, day: $("fuDay").value || P.today(), author: me && me.id, content, judgment: $("fuJudg").value, reason: $("fuReason").value.trim(),
        next_step: $("fuNext").value.trim(), next_due: $("fuDue").value, stage_change: stage });
      if (stage && stage !== (g("stage") || "建议")) await P.patch("opportunity", rid, { stage });
      ["fuContent", "fuReason", "fuNext", "fuDue"].forEach((id) => { $(id).value = ""; }); $("fuJudg").value = ""; $("fuStage").value = "";
      P.toast("跟进已记下" + (stage ? ",阶段改为「" + stage + "」" : ""));
      await Promise.all([loadOpp(), loadLists()]);
    } catch (e) { P.toast(e.message, true); } finally { btn.disabled = false; $("fuMsg").textContent = ""; }
  }

  async function requestReport() {
    const btn = $("rpSave"); btn.disabled = true; $("rpMsg").textContent = "排队中…";
    try {
      const kind = $("rpKind").value;
      await P.create("report", { kind, edition: $("rpEd").value, day: P.today(), gen_status: "待生成", requested_by: me && me.id,
        opportunity: kind === "项目报告" ? rid : null, country: P.linkId(g("country")) });
      P.toast("已排队,2 分钟内生成");
      await loadLists();
    } catch (e) { P.toast(e.message, true); } finally { btn.disabled = false; $("rpMsg").textContent = ""; }
  }

  async function saveQuick(values) {
    const btn = $("quickSave"); btn.disabled = true; $("quickMsg").textContent = "保存中…";
    try { await P.patch("opportunity", rid, values); P.toast("已保存"); await loadOpp(); }
    catch (e) { P.toast(e.message, true); } finally { btn.disabled = false; $("quickMsg").textContent = ""; }
  }

  try {
    await P.load();
    if (P.isPartner) return P.partnerOnly();  // 伙伴帐号不开放商机跟进
    canWrite = await P.canWrite();
    if (!canWrite) P.guest();  // 游客帐号(查看者)只能看
    if (!rid) { $("head").innerHTML = '<div class="note n-bad">网址里没有商机编号,从 <a href="opps.html">商机总览</a> 点进来。</div>'; return; }
    P.choices("followup", "judgment").forEach((s) => { const op = document.createElement("option"); op.textContent = s; $("fuJudg").appendChild(op); });
    P.choices("opportunity", "stage").forEach((s) => { const op = document.createElement("option"); op.textContent = s; $("fuStage").appendChild(op); });
    $("fuDay").value = P.today();
    const [, u] = await Promise.all([loadOpp(), P.me()]);
    me = u;
    const cid = P.linkId(g("country"));
    if (cid) { const c = await P.api("/table/" + P.t("country").id + "/record/" + cid, { fieldKeyType: "id" }); if (c) { countryName = { iso: P.get("country", c, "key"), zh: P.get("country", c, "name_zh") || P.get("country", c, "key") }; await loadOpp(); } }
    await loadLists();
    $("fuSave").onclick = saveFollowup;
    $("rpSave").onclick = requestReport;
    $("mine").onclick = () => saveQuick({ owner: me && me.id });
    $("quickSave").onclick = () => saveQuick({ priority: $("prio").value || null, internal_note: $("note").value });
  } catch (e) { P.fail($("head"), e); }
})();
</script>
</body>
</html>
