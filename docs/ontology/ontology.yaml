changes_v2_32:   # 复核按钮(2026-10-19):使用方问「助手给出结论,需要人工复核的地方,能否增加"已复核""帮我复核""忽略此项"之类按钮?如果做到对话框里是不是 AI 助手不好理解?」
  - 助手看一条链接或一份文件的结果里,「要核实」的每一条后面有 已复核 / 帮我复核 / 忽略此项,「库里可能是同一项目」的每条线索后面有 是同一项目 / 帮我复核 / 不是同一项目。
    按钮是页面上的操作,不是说给模型听的话(模型只看原文和附言,看不到按钮),所以不会让助手糊涂
  - 新增业务对象「助手复核记录」(review):一条点选一行(材料、项目、条目类型、条目、线索、处理、结论、依据、补充事实、操作人、时间;新分类体系 review_kind、review_status),
    按材料(网址或文件指纹)+ 条目算编号;同一份材料再看时照旧显示点过的,投标评估按点选重算(A47):确认是同一项目的线索算「库里已有」,否定的从相关里去掉
  - 「帮我复核」由助手自己做(A48):要核实的点 → 整国世行公告按编号、名字比对,新闻旁证,请模型据此给结论、把握(高 / 中 / 低)和核出的事实(截止日、阶段、金额、门槛),
    核出的截止日等补进评估重算;库里线索 → 请模型把线索和材料对一对,判 同一项目 / 同项目别的标段 / 不同项目。没查到也给有依据的判断,不把「先核实」推回给人(10-16 规则)
  - 表没建时点选只在这一页有效,页面写明;要跑一次建表命令(新表)
changes_v2_31:   # 助手判投标(2026-10-18):使用方问「发一个项目链接,助手能否直接给出是否可以投标的结论,并附一份项目报告」,并定了四步:信源真实、国别范围、招标要求、时间
  - 助手看一条链接或一份文件(core/link_check.py)时附投标评估(core/bid_check.py):八项检查 → 三档结论(建议投标 / 有条件可投 / 不建议投标),每条理由带依据链接。
    使用方的四步之外补四项:是不是水务、阶段能不能投(已授标、在建的不是投标机会)、库里有没有同一项目或已跟踪的商机、我方在该国的基础(市场分布表的当地机构、在建项目、常驻人员)。
    国别范围按市场分布表(私有配置;新字段 lead = 本单位是不是该国主责单位,主责表里不归本单位的算有条件),没配时按国别表的市场分级(重点、市场)。
    任一项不通过 → 不建议投标;有条件或关键项不明 → 有条件可投并列出缺什么;全过 → 建议投标。判不了的写「不明」并说明要查什么,不把「先核实」推给人(使用方 10-16 的规则)
  - 模型抽取加:截止日、联合体说法、有利因素、不利因素(都只写原文有依据的);时间检查按截止日算剩几天,不到三周算紧(意向书、资格预审写明材料少能赶上)
  - 评估报告(Word,角标回原文):结论在最前,再是项目基本情况(金额同时折美元、人民币)、八项检查、招标要求与本单位业绩对照(兄弟单位只作参考;营业额、财务资源写明要财务部出数)、
    有利不利、库里相关、下一步、信源与依据。清单型材料每条都评,另出总体报告(逐条结论一张表 + 每条小节)。报告在看链接的后台任务里出好,页面给下载按钮,结果留半小时;不建报告行、不改表结构
changes_v2_30:   # 国别报告照阿塞拜疆成稿重写(2026-10-16):使用方说概况页新加的水风险、营商环境在模板里没有;接着对比成稿 60 页、程序出的 20 页「像粗制滥造」
  - 国别报告(A14)章节改成成稿的 15 章 72 节(研究背景 4 节、国家概况 7 节、人口 4、水资源 4、体制法规 7、供水 5、污水 6、首都专题 7、区域城镇 2、资金 5、市场规模测算 7、
    竞争格局 6、市场准入 5、机会与策略 6、风险 5)+ 附录 A–G(数据来源、项目管道、机构与企业名录、水务设施、术语、研究资料、原文链接);节名里的「首都」「我国」出报告时换成实际的首都名与投标人国籍
  - 写法:每节由模型写成 300–800 字的完整段落(每批 6 节),库里有数据的按数据写,没有的按模型确知的公开资料写并逐句标「(公开资料,待核实)」,给不出的数写「需人工补充」;
    库里的表放在段落后面作支撑;没配模型时只出数据表(附录 A 写明)。使用方选的「照成稿 72 节写」
  - 国别概况页有的数据报告也有:近期中标项目(近 3 年按中标价,角标回原公告,本国企业份额)、主要中标单位与国别分布、营商环境细项(对外企不利的标超警戒线)、收了原文的法规、
    排放标准、本国定义、水务大事记(按类别分到机构改革、规划、水价、项目批准、工程投运各节)、水务片区、人均 GDP(PPP)、总体水风险、内部版的国别备注;研究资料与原文链接进附录。
    报告模板正文的章节目录同步重出;不改表结构
changes_v2_29:   # 招标监测报告(2026-10-16):使用方只关心水务、要 Word、每条信息带可点的角标回到原公告;同事手工做的监测 PDF 不合要求
