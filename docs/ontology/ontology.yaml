          - {v: CAD, code: cad, def: 加元}
          - {v: SGD, code: sgd, def: 新加坡元}
          - {v: HKD, code: hkd, def: 港元}
      - name: 中东与北非
        values:
          - {v: AED, code: aed, def: 阿联酋迪拉姆}
          - {v: SAR, code: sar, def: 沙特里亚尔}
