  - id: A30
    name: 补供应商资料
    actor: human
    channel: [表格]
    trigger: 随时(在表格「供应商」里补中文名、性质、母公司、官网、主营领域、简介;别的来源的新单位也可以加一行)
    creates: contractor
    writes: [contractor.name, contractor.name_zh, contractor.nationality, contractor.nationality_code, contractor.kind, contractor.parent, contractor.website, contractor.sectors, contractor.profile, contractor.note]
    note: 机器只建行、只填名称与国别,人补的资料机器不动(R2)。
    rules: [R13]
  - id: A31
    name: 导入研究资料
    actor: ai
    channel: [命令行, 后台]
    trigger: 一次性(python -m core.jobs.studies;数据文件换了再跑一次);后台每个周期给没有中文标题的补一批中文标题
    reads: [country]
    creates: study
    writes: [study.name, study.name_zh, study.kind, study.publisher, study.published, study.language, study.country, study.project, study.url, study.summary]
    note: "数据文件是私有配置仓的 data/studies.csv.gz。由 scripts/fetch_wb_studies.py 从世界银行文件库(documents.worldbank.org 的公开检索接口)取:
      指定国家里水务相关的项目(名称或行业有供水、污水、灌溉、防洪等),每个项目取最新的评估文件(没有的取项目文件或项目信息文件)、完成报告、一份主要的环境社会评估;
      另收标题有水务字样的行业研究。只新建、只填空(R2),去重按编号;综述那几行由人(或助手)读原文整理后放进同一个数据文件。"
    rules: [R2]
  - id: A32
    name: 补录研究资料
    actor: human
    channel: [表格]
    trigger: 随时(在表格「研究资料」里加一行或改一行)
    creates: study
    writes: [study.name, study.name_zh, study.kind, study.publisher, study.published, study.language, study.country, study.project, study.url, study.summary, study.note]
    note: 至少填标题、类型、所属国别;别的机构(亚行、欧洲复兴开发银行、本国政府)的规划和报告都可以加。
    rules: [R13]
  - id: A33
    name: 导入水务事件
    actor: ai
    channel: [命令行]
    trigger: 一次性(python -m core.jobs.studies 同时导入;数据文件换了再跑一次)
    reads: [country, city]
    creates: water_event
    writes: [water_event.day, water_event.title, water_event.kind, water_event.country, water_event.city, water_event.source, water_event.url]
    note: "数据文件是私有配置仓的 data/events.csv.gz。项目批准、项目完成由 scripts/fetch_wb_studies.py 从世界银行项目库取(批准日、关闭日、承诺额);
      其余类别由人(或助手)读研究资料原文摘出,只收原文写明年份的,每条注明出处页码。只新建、只填空(R2),去重按编号。"
    rules: [R2]
  - id: A34
    name: 补录水务事件
    actor: human
    channel: [表格]
    trigger: 随时(在表格「水务事件」里加一行或改一行)
    creates: water_event
    writes: [water_event.day, water_event.title, water_event.kind, water_event.country, water_event.city, water_event.source, water_event.url, water_event.note]
    note: 至少填日期、事件、类别、所属国别;新闻里看到的调价、投运、改组都可以记。
    rules: [R13]
  - id: A35
    name: 划定水务片区
    actor: human
    channel: [表格]
    trigger: 随时(在表格「水务片区」里加一行;在商机上选所属片区)
    creates: water_area
    writes: [water_area.name, water_area.name_en, water_area.country, water_area.cities, water_area.utility, water_area.sources, water_area.scope, water_area.basis, water_area.note, opportunity.area]
    note: 按供排水服务区划:同一家水司、同一批水源与干管的连片城市算一个片区;只有一座城市自成水司的不必建片区。
    rules: [R13]
  - id: A36
    name: 导入营商环境数据
    actor: ai
    channel: [命令行, 后台]
    trigger: 数据文件换了以后跑一次(python -m core.jobs.bready);后台每天城市维护之后也跑一遍,新建的国别跟着补
    reads: [country]
    writes: [country.bready_total, country.bready_water, country.bready_procure, country.bready_dispute, country.water_tariff, country.water_tariff_cur, country.water_tariff_usd,
             country.water_reliable, country.water_conn_days, country.foreign_bid, country.award_days, country.gov_pay_days, country.bready_items, country.bready_edition]
    note: "数据文件在私有配置仓 data/bready.csv(按 ISO3),由 scripts/build_bready.py 从世界银行 B-READY 数据包(B-READY_ALL_DATA_<年份>.zip,两个 Excel)整理:只取和水务、投标有关的约 20 项;
      商业水价按整理那天的汇率折美元,折出来每立方米低于 0.03 或高于 15 美元的多半填错币种,不收、在细项里注明;香港、台湾不收。
      世行每年出一期(2024 年 50 个经济体,2025 年 101 个,计划扩到约 180 个),新一期出来后重做数据文件:同一期只填空(人改过的不动),数据版本变了整组替换(R2 的例外,同世行宏观指标)。"
