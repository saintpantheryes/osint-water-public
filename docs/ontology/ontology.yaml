      - name: 撒哈拉以南非洲
        values:
          - {v: NGN, code: ngn, def: 尼日利亚奈拉}
          - {v: GHS, code: ghs, def: 加纳塞地}
          - {v: KES, code: kes, def: 肯尼亚先令}
