# 口径与术语(glossary):页面、报告、表格视图共用，只定一次(R14)。stages 引用 taxonomies.stage 的值，tests 检查都存在。
glossary:
  risk_level:
    term: 水风险分数怎么读
    means: "Aqueduct 的 0–5 分:0–1 低,1–2 低到中,2–3 中到高,3–4 高,4–5 极高;用水压力 4 分以上 = 取用量超过可用量的 80%。分数是模型估计,不是实测"
    used_in: [城市概况, 国别概况, 趋势机会]
  trend_self_funded:
    term: 自付型机会(趋势)
    means: "城市水风险(缺省 = 总体水风险)≥ 4 分(极高)且人均 GDP(PPP)≥ 2 万美元:缺水或水质差、当地也付得起,项目多半自筹或 PPP。两个门槛页面上可调"
    used_in: [趋势机会]
  trend_loan_driven:
    term: 贷款型机会(趋势)
    means: "城市水风险 ≥ 4 分(缺省),且所在国别近年有开发性贷款进水务:世行涉水项目数 ≥ 1,或最近一年本库里出资方属开发性金融(世行、亚行、亚投行、非开行、欧复行、欧投行、伊开行、美开行、欧佩克基金、法开署、德复兴银行)的线索 ≥ 3 条。贷款按国家批,这一类按国别判,城市沿用;门槛页面上可调"
    used_in: [趋势机会]
  tracked:
    term: 跟踪中的商机(在跟踪)
    means: 我方阶段 ∈ 跟踪中、准备投标、已投标、中标;即不是 建议、不跟进、未中标、放弃，也不是空
    stages: [跟踪中, 准备投标, 已投标, 中标]
    used_in: [线索总览卡片「跟踪中的商机」, 漏斗第四级, 日历缺省范围, 商机总览缺省, 周报月报的「未来 N 天时间节点」范围, 「商机总览 · 下一步已逾期」]
    code: portal.js P.tracked;core/jobs/reports.py build_periodic 的 tracked
  ai_suggested:
    term: AI 推荐的商机
    means: 我方阶段 = 建议;机器新建的、人还没定跟不跟的商机。表格视图名仍是「建议商机」，页面统一叫 AI 推荐
    stages: [建议]
    used_in: [线索总览卡片, 「线索处理」第二页, 国别报告的项目机会清单]
  pending_leads:
    term: 待处理线索
    means: 是否相关 = 是 且 处理状态 = 待处理
    used_in: [线索总览卡片, 表格视图「待处理」]
  to_assign:
    term: 待确认归属
    means: 所属商机为空，且(建议所属商机非空 且 处理状态 ≠ 已忽略)或(可能是新项目 = 是 且 处理状态 = 待处理)
    used_in: [线索总览卡片, 表格视图「待确认归属」, 「线索处理」第一页]
  overdue:
    term: 下一步已逾期
    means: 商机在跟踪(tracked)且 下一步到期 < 今天(页面按当前日期算，R12)
    stages: [跟踪中, 准备投标, 已投标, 中标]
    used_in: [「商机总览 · 下一步已逾期」]
  review:
    term: 待核更新
    means: 商机.待核更新 非空(去掉行首 ✗ 的驳回行后仍有内容);一行一条机器提议
    used_in: [「商机总览 · 待核更新」, 表格视图「待核更新」, 商机工作台的提示]
  core_sectors:
    term: 核心领域
    means: 线索领域 ∈ 供水、污水、海水淡化、雨水排涝、水环境;profile 的 sector_scope 开了灌溉排水或防洪流域时加上水利
    sectors: [供水, 污水, 海水淡化, 雨水排涝, 水环境]   # 代码读这里(core/jobs/suggest.py CORE_SECTORS)
    used_in: [机器新建建议商机的门槛(A06)]
  threshold:
    term: 建议商机门槛
    means: 国别市场分级 ∈ 重点、市场 且 领域含核心领域 且 类别 ∈ 招标、意向书、资格预审、总采购公告、特定采购公告、融资、立项或规划;模型判为新项目且过门槛才新建，否则只勾「可能是新项目」等人定
    categories: [招标, 意向书, 资格预审, 总采购公告, 特定采购公告, 融资, 立项或规划]   # 代码读这里(core/jobs/suggest.py NEW_OPP_CATEGORIES)
    tiers: [重点, 市场]
    used_in: [A06]
  lead_no:
    term: 线索号
    means: 信源 + 原文键的指纹前 8 位(十六进制);正文里的 [线索号] 在页面上显示为角标 ①②③，点开是那条线索
    example: 3f9a1c2e
  opp_code:
    term: 商机编号
    means: ISO3-三位序号，序号 = 该国已有最大序号 + 1;机器与页面新建都按这个取，不复用已删或不跟进的号
    example: AZE-003
  pdate:
    term: 日期原文
    means: 时间节点的日期可以不精确:2026 / 2026-H2 / 2026-Q4 / 2026-12 / 2026-12-15;「日期」字段存区间起点，原文另存一列
  r_ref:
    term: R 号
    means: 国别成稿里的条目号〔R012〕，出现在国别的市场准入等列表里;只提示出处，不跳转(不是线索号)

# 行业术语的初始词(terms,v2.11 起):Teable「行业术语」表(对象 term)建好时写进表的几行;表没建或读不到时助手用这里兜底。
# 平时加词、改相关词在表里改,不改这里。字段含义见对象 term:aliases 同义说法、covers 跨哪些领域、sectors 按领域筛(空 = 不限领域)、match 相关词、means 说明。
terms:
  - term: 智慧水务
    aliases: [智慧水利, 智慧水网, 智慧供水, 智慧排水, 数字水务, 数字水利, 水务信息化, 水务数字化, smart water]
    covers: [供水, 污水, 雨水排涝, 水利]
    sectors: []
    match: [智慧水务, 智慧水利, 智慧水网, 智慧供水, 智慧排水, 数字孪生, 数字化, 信息化, 物联网, 智能, 在线监测, 远程监控, 自动化控制, 漏损, 产销差,
            smart, digital, SCADA, telemetry, hydraulic model, automation, non-revenue, numérique, télégestion, inteligente, telemetría]
    means: 用信息化、物联网、自动控制与模型手段管水:供水管网监测与漏损控制、智能水表、污水厂与泵站自控、排水防涝监测、灌区与水库的数字孪生都算;跨供水、排水、水利,不是某一个领域
  - term: 海绵城市
    aliases: [sponge city]
    covers: [雨水排涝, 水环境]
    sectors: []
    match: [海绵城市, 海绵, sponge city, 雨水花园, 透水, green infrastructure, nature-based, low impact development]
    means: 用透水铺装、下沉绿地、雨水花园等让城市就地蓄渗雨水,兼顾排涝与水环境;线索多记在雨水排涝或水环境,也有记在其他的
  - term: 漏损控制
    aliases: [降漏, 控漏, 降低漏损, 产销差, 无收益水, nrw]
    covers: [供水]
    sectors: [供水]
    match: [漏损, 产销差, 无收益水, non-revenue, water loss, leak, pertes, fugas, agua no contabilizada]
    means: 降低供水管网的漏失与计量损失(分区计量、检漏、换表、管网改造);只在供水领域里找

# 数据范围(data_scope,v2.11 起):哪些国家的哪类数据不在采集范围。助手的提问涉及这些国家时,在答案上方原样显示 note,免得把「查不到」读成「没有项目」。
# words 是提问里指这个国家的口语(如「国内」);note 要写准:不是库里一条该国数据都没有,而是哪类信源没采。
data_scope:
  not_collected:
    - iso3: CHN
      words: [国内, 我国, 大陆, 内地, 香港, 澳门, 台湾]
      note: 数据范围:本系统面向海外,不包含中国国内(大陆、港澳台)数据。

# 代码里还剩哪些"写死"的东西(code_enums,v2.2 起):枚举值本身都在运行时从本体读(core/ontology.py 的 values / codes / glossary_stages;
# 页面读 portal/ontology.json 的 P.onto),改选项只改本体(再在 Teable 里加选项)。下面列的是代码里仍保留的"映射"——英文键之间、或配置键 → 本体 code 的对应关系,
# 它们指向的值由 tests/test_ontology.py 核对必须存在。改映射关系(不是改值)仍要改代码。
# 页面筛选用的归组(不是枚举:底下的字段是自由文本,值不规整,页面按这里的规则归到一组;页面与后台都运行时读这里)
# 游客(不是库协作者的登录账号)能看到什么:页面检测到登录人在库里没有角色时,改走后台任务进程里的只读通道(core/guest.py,
# /portal/api/assistant/guest/*),通道按这里放行:只列这些对象,去掉 deny 里的属性;报告只给定期报告的公开版。
# 跟进记录、成员、报告模板整表不经过通道。业务数据(band: business)与人写的内部字段都在外面;改这里即改游客能看的范围。
guest:
  data: sample   # 游客只看示例数据(2026-10-09 使用方定):记录全部来自 core/sample.py 编的示例,真实库一条不给;下面的放行范围照旧作第二道关
  objects:
    lead: {deny: [note]}
    country: {deny: [presence, note]}
    opportunity: {deny: [owner, internal_note, priority, judgment, next_step, next_due, last_followup]}
    milestone: {}
    source: {}
    city: {}
    supply_plant: {}
    sewage_plant: {}
    report: {deny: [requested_by], rows: "版本 = 公开版 且 类型 ∈ 定期(周报、月报、日报)", kinds_group: 定期, edition: 公开版}
  note: 游客登录后在表格里什么也看不到(不在库里);页面上看到的线索、商机、国别、时间节点、报告都是编出来的示例数据,不是真实内容;「打开表格」「在表格里打开」不显示;不能登记跟进、申请报告、订阅日历或改任何字段。

groupings:
  funders:
    name: 资金来源
    def: 线索「出资方」(自由文本,机器从原文抄)与商机「资金」每行开头的出资方,按机构族归组;大小写不分,包含即算;一条同时写了两家的两组都算
    over: [lead.funder, opportunity.financing]
    other: 其他出资方   # 有值但不属于下面任何一组
    empty: 未填         # 没有值
    groups:
      - {v: 世界银行, code: wb, patterns: [World Bank, WB, IDA, IBRD, BIRD, BIRF, Banque Mondiale, Banco Mundial, International Development Association, International Bank for Reconstruction, 世界银行, 世行]}
      - {v: 亚洲开发银行, code: adb, patterns: [Asian Development Bank, ADB, 亚洲开发银行, 亚开行]}
      - {v: 亚投行, code: aiib, patterns: [AIIB, Asian Infrastructure Investment Bank, 亚投行]}
      - {v: 非洲开发银行, code: afdb, patterns: [African Development Bank, AfDB, Banque Africaine de Développement, 非洲开发银行, 非开行]}
      - {v: 欧洲复兴开发银行, code: ebrd, patterns: [EBRD, European Bank for Reconstruction, 欧洲复兴开发银行]}
      - {v: 欧洲投资银行, code: eib, patterns: [EIB, European Investment Bank, 欧洲投资银行]}
      - {v: 伊斯兰开发银行, code: isdb, patterns: [IsDB, Islamic Development Bank, Banque Islamique, 伊斯兰开发银行]}
      - {v: 美洲开发银行, code: idb, patterns: [IDB, Inter-American Development Bank, 美洲开发银行]}
      - {v: 欧佩克基金, code: opec, patterns: [OPEC, 欧佩克]}
      - {v: 法国开发署, code: afd, patterns: [AFD, Agence Française de Développement, French Development Agency, 法国开发署, 法开署]}
      - {v: 德国复兴信贷银行, code: kfw, patterns: [KfW, 德国复兴信贷银行]}
      - {v: 欧盟, code: eu, patterns: [European Union, EU NIP, E5P, CINEA, 欧盟]}
      - {v: 联合国机构, code: un, patterns: [UNDP, UNICEF, UNOPS, UN-Habitat, UNHCR, 联合国]}
      - {v: 美国开发机构, code: us, patterns: [US DFC, USAID, Millennium Challenge, 美国国际开发]}
      - {v: 本国政府, code: gov, patterns: [Government, Gouvernement, Gobierno, Ministry, Ministère, 政府, 国家预算, Commune, Municipal]}
  regions:
    name: 区域
    def: 使用方的经营区域划分,取国别表「经营区域」的值(人填;一国一区);页面的「区域」按钮就是这些值,再加「未划区」= 经营区域为空的国家;选区域后国别只列该区域的,选国别自动点亮它的区域
    over: [country.market]
    empty: 未划区
    note: 2026-10-04 查库:93 国里 39 国填了经营区域(西非、东非、中西亚、中非、南太平洋、中东欧、南美北、中东、西南欧区域,另有「土耳其公司」),54 国没填;要让更多国家进区域,在国别表里填经营区域即可,页面不用改

code_enums:
  - {where: core/jobs/common.py CAT, taxonomy: lead_category, note: "判定英文键 = 本体 code;只多一个 page(页面变化)→ 其他"}
  - {where: core/jobs/common.py _PUBLIC_STAGE_CODE, taxonomy: lead_category → public_stage, note: 线索类别 code → 公开进度 code 的对应关系(规则,不是枚举)}
