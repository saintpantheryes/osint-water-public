changes_v2_27:   # 答错了当场改正、助手会查城市(2026-10-15):使用方问「吉尔吉斯斯坦有多少个规模以上城市」,助手答成了营商环境;
                 # 反馈答错之后问「如何让 AI 立即学习,而不是等它每日复盘」
  - 答错了写了哪里不对的:助手按这句说明请模型重新理解,当场在下面重答(A45);对重答点「答对了」→ 原来那一问记下「学到的解析」(ask_log.learned,新字段)、
    应理解为空着的写上这次的理解、状态改「已修好」,马上生效:同一句(连同上一问)以后直接按它答、不再问模型;说法差不多的问题把它当参考例子交给模型。
    人把状态改成「不改」或清空「学到的解析」就不再用。没配模型时不能当场重答,照旧进错题本
  - 助手会查城市(city):多少个规模以上城市、哪些城市、人口最多的几座、按人口门槛、按国别统计;问的东西不在助手会查的几类里(水厂、污水厂的数量等)的,
    直说还不会查,不硬套成别的对象
  - 要跑一次建表命令(新字段)
changes_v2_26:   # 助手的错题本、发前核对、歧义先问(2026-10-15):使用方拿「Data Agent 全流程」「RAG 消息流」两张图问助手算不算 RAG、有什么可借鉴;
                 # 借三样:答错的问题沉淀下来每天复查(图一 ⑲、图二 ⑫–⑮)、答前核对不过就重来(图一 ⑮、图二 ⑩)、口径有歧义先说清(图一 ⑤⑥)。使用方说「要做」
  - 新增业务对象「助手提问记录」(ask_log):每问一句记一行(提问、接着哪一问、理解为、解析方式、谁问的、什么时候;A44,游客的不记);
    答案下面「答对了」「答错了」记在这一行(反馈、哪里不对、答出了什么;A45):答对了的把当时的理解为抄进「应理解为」,答错了的处理状态记「待看」(新分类体系 ask_verdict、ask_status)。
    改好了的在「应理解为」写对的理解、状态改「已修好」。每天系统自动更新之后(本地 08:40 以后)把「应理解为」不空、没标「不改」的问题重问一遍,对不上的写进「复查」(A46)
  - 语义层加「有歧义的说法」(semantic.ambiguous):「项目」指线索、已中标项目还是商机,只说「刚果」是哪一国,「近 N 年」往前推满还是按日历年。
    照缺省先答,答案上面写明按哪一种算的,另几种给按钮,点了按改写后的问题重问
  - 发前核对:按条件查出 0 条时,页面逐个去掉一个条件再数(不去国别),第一个查得到的照它列出,上面写明去掉了哪一项、原条件是 0 条;
    法规按条文作答的,回答里的每个数都到所引条文(原文、中文译文、法规名、条号)里找一遍,找不到的让模型重写一次,还找不到就不用这段回答、只列条文
  - 要跑一次建表命令(新表)
changes_v2_25:   # 语义层集中查看、说法挪进表格(2026-10-14):使用方问语义层在哪能看到、能不能管理;当时行业术语在本体页「口径与归组」,本国定义在国别概况,
                 # 指标、算法与口语说法只在本体文件里,页面看不到,改要改程序。使用方选「做」:本体页加「语义层」页签集中看,口语说法挪进表格由懂行的人改
  - 新增公开对象「语义层说法」(phrase):一个指向一行:类别(新分类体系 phrase_kind:指标、算法、主体工程、法规问法、排放指标)、指向(指标名、算法名、主体工程、法规问法或排放指标,照本体写)、
    说法(提问里出现任一个就算问到它)、说明。助手每分钟重读这张表:表里有这一行的按表里的说法认(表里删掉的说法助手不再认),表里没有的用本体 semantic 节的初始说法;
    指向写错(本体里没有)的那一行不用,页面标出。新指标、新算法要程序会算,仍改本体
  - 新增行为 A42 维护语义层说法(人,表格)与 A43 补齐语义层说法(后台每个周期:本体里有、表里没有的指向补一行,带初始说法;只新建,不改已有的行)
  - 本体页(V13)加「语义层」页签:指标(单位、算法、缺数时怎么说、说法)、算法、主体工程与法规问法的说法(读表,读不到时显示本体初始说法)、行业术语(从「口径与归组」挪过来)、
    本国定义(按国别数,点开到国别概况),各块有「在表格里打开」
