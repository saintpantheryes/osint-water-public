      options:
        - {label: "往前推满 {n} 年({days} 天)", how: rolling}
        - {label: "{y0} 年 1 月 1 日至今(今年算一年)", how: since}
        - {label: "{y1}–{y2} 年({n} 个整年)", how: whole}

