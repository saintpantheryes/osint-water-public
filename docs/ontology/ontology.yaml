          - {v: RSD, code: rsd, def: 塞尔维亚第纳尔}
          - {v: UAH, code: uah, def: 乌克兰格里夫纳}
          - {v: RUB, code: rub, def: 俄罗斯卢布}
      - name: 拉美与加勒比
        values:
          - {v: BRL, code: brl, def: 巴西雷亚尔}
          - {v: MXN, code: mxn, def: 墨西哥比索}
          - {v: COP, code: cop, def: 哥伦比亚比索}
          - {v: PEN, code: pen, def: 秘鲁索尔}
          - {v: CLP, code: clp, def: 智利比索}
          - {v: ARS, code: ars, def: 阿根廷比索}
          - {v: BOB, code: bob, def: 玻利维亚诺}
          - {v: PYG, code: pyg, def: 巴拉圭瓜拉尼}
          - {v: UYU, code: uyu, def: 乌拉圭比索}
          - {v: DOP, code: dop, def: 多米尼加比索}
          - {v: JMD, code: jmd, def: 牙买加元}
      - name: 南太平洋
        values:
