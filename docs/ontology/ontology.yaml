  - 商机工作台加「放弃跟踪」按钮(A50,二次确认、可写一句原因):阶段改「放弃」(已结束的不改)、勾「已归档」、记原因与日期,自动留一条跟进;不删、所属线索不动。
    已归档的商机页顶上一条说明(日期、原因),按钮变「恢复跟踪」:去掉已归档,「放弃」的改回「跟踪中」,再留一条跟进
  - 商机总览、日历、报告页选商机、国别概况、首页与助手默认不算已归档的商机,说明行「已归档 N 个商机 · 显示」(网址 ar=1,同过期线索归档的样式);点开已归档商机仍看全部内容。
    口径 tracked / decided 都不含已归档(glossary.archived_opp);后台日报、周报月报、日历订阅同一口径
  - 主按钮改醒目(更大、更深、带阴影),危险操作(放弃跟踪)用红色主按钮;各处关键操作都用主按钮
changes_v2_34:   # 过期线索归档(2026-10-20):使用方问「线索是否有有效期?…所有过期线索标个归档,以免数据越堆越多影响读取速度」
  - 线索加三个机器写的属性:已归档、归档原因、归档时间。后台每天零点后(E8)把过期线索标「已归档」(A49):截止日已过的,或发布(没有发布日期按发现时间)超过一年且没归入商机的;
    不删、不改处理状态;人手工取消归档(勾掉「已归档」)的不再打回(归档时间还在即不再碰)。R2 的例外(机器维护的运行状态),同 A19
  - 页面与助手默认不算已归档的线索:线索总览、线索分析、线索处理、国别概况、助手问线索,说明行「已归档 N 条 · 显示」(同忽略国别的样式);
