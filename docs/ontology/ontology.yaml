          - {v: MMK, code: mmk, def: 缅甸元}
          - {v: KHR, code: khr, def: 柬埔寨瑞尔}
      - name: 中亚、高加索与蒙古
        values:
          - {v: KZT, code: kzt, def: 哈萨克斯坦坚戈}
          - {v: UZS, code: uzs, def: 乌兹别克斯坦苏姆}
          - {v: AZN, code: azn, def: 阿塞拜疆马纳特}
