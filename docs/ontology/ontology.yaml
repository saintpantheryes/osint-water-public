  award_contract_type:
    name: 合同类型
    used_by: [award.contract_type]
    note: 按世界银行采购的四类,另加运营(使用方 2026-10-12 要);别的来源照此归。
    groups:
      - name: 全部
        values:
          - {v: 工程, code: works, def: 土建与安装工程(含设计施工总承包), boundary: "", example: "净水厂 EPC"}
          - {v: 货物, code: goods, def: 设备、材料采购, boundary: 带安装的设备采购也算货物, example: "水表 5 万只"}
          - {v: 运营, code: operation, def: 运营维护、委托运营、管理合同、租赁经营(affermage)、绩效型减漏等以运营为主的合同, boundary: "设计建设运营(DBO)以建设为主的仍算工程;导入时名称里有 operation and maintenance、O&M、management contract、affermage、exploitation et entretien、gestion et exploitation、entretien et maintenance 等字样的归这里(修理工程 travaux d'entretien et réparation 不算)", example: "某市供水管网 5 年运维"}
          - {v: 咨询服务, code: consulting, def: 设计、监理、可研、技术咨询, boundary: "", example: "施工监理"}
          - {v: 非咨询服务, code: non_consulting, def: 运维、勘测、钻探等以产出计的服务, boundary: "", example: "管网检漏服务"}
  award_delivery:
    name: 承包模式
    used_by: [award.delivery]
    note: 合同怎么包(使用方 2026-10-13 要能单独查 DBO、EPC);与合同类型(买的是什么)分开记。导入时按名称与采购方式认,先中先得:DBO → BOT/PPP → 设计施工 → 按合同类型(工程 = 施工,运营 = 运营);咨询服务、名称是咨询监理顾问的不分。
    groups:
      - name: 全部
        values:
          - {v: 施工, code: build, def: 按业主的设计施工(工程合同的缺省), boundary: 名称里写明设计施工、运营或特许经营的归下面几类, example: "配水管网铺设"}
          - {v: 设计施工, code: design_build, def: 设计加施工一并承包:EPC、设计建造(design-build)、交钥匙、conception-réalisation, boundary: 含建成后运营的算 DBO, example: "净水厂 EPC"}
          - {v: DBO, code: dbo, def: 一份合同里既建(新建、扩建或改造)又负责建成后的运营维护:设计建造运营(DBO、DBOT)、施工加若干年运维、mise à niveau et exploitation,
             boundary: 资金由业主出;承包方自己融资、靠收费回本的算 BOT/PPP;只运营不建的算运营, example: "污水厂设计建造并运营 10 年"}
          - {v: BOT/PPP, code: bot_ppp, def: 承包方投资或融资、建成后经营一段时间回本:BOT、BOO、PPP、特许经营(concession)、印度的混合年金(hybrid annuity), boundary: "", example: "海水淡化厂 PPP"}
          - {v: 运营, code: operation, def: 只管运营维护、不建:委托运营、管理合同、租赁经营等(即合同类型「运营」), boundary: 带改造的算 DBO, example: "某市供水管网 5 年运维"}
  bready_foreign:
    name: 外企参标限制
    used_by: [country.foreign_bid]
    note: 世界银行 B-READY 专家问卷「法规是否对外国企业参标或授标设限」的国别答案;专家答案没有多数的记「说法不一」
    groups:
      - name: 全部
        values:
          - {v: 无限制, code: none, def: 法规不限制外国企业参标或授标, boundary: "", example: "乌兹别克斯坦"}
          - {v: 部分招标有限制, code: some, def: 部分公共招标限制外企(如只许本国企业、本国优先、限额以下只给本地), boundary: "", example: "阿塞拜疆"}
          - {v: 全部招标有限制, code: all, def: 所有公共招标都对外企有限制, boundary: "", example: "马里"}
          - {v: 说法不一, code: mixed, def: 专家答案没有多数, boundary: "", example: "摩洛哥"}
  award_asset:
    name: 主体工程
    used_by: [award.asset]
    note: 这份合同主要建(或管)的是什么(使用方 2026-10-13 要水厂、管网分开看,重点是污水处理厂、供水厂、海水淡化厂)。导入时按名称认,先看「Lot …:」「Contract title:」后面那段:海水淡化厂 → 污水处理厂 → 供水厂;厂和管网都写了的,管网在前、厂只是修饰(「供某水厂的输水管」)的算管网,否则算厂。
    groups:
      - name: 水厂
        values:
          - {v: 污水处理厂, code: wwtp, def: 污水处理厂、污泥与粪污处理厂(STEP、WWTP、STP、КОС), boundary: 只做厂外收集管的算管网, example: "某市污水处理厂扩建"}
          - {v: 供水厂, code: wtp, def: 净水厂、自来水厂、除铁除氟站(WTP、station de traitement、ВОС), boundary: "", example: "5 万吨/日净水厂"}
          - {v: 海水淡化厂, code: desal, def: 海水或苦咸水淡化(SWRO、BWRO、dessalement), boundary: "", example: "2.4 万吨/日海水淡化 DBO"}
      - name: 管网与配套
        values:
          - {v: 管网, code: network, def: 供水与排水管网、输水干管、污水收集管、接户管, boundary: "", example: "配水管网 17 km"}
          - {v: 供水系统(综合), code: water_system, def: "名称只写供水系统、供水工程,看不出是厂还是管网", boundary: "", example: "某镇供水系统改造"}
          - {v: 泵站水池水源, code: pump_reservoir, def: 泵站、水池、水塔、水井与取水, boundary: "", example: "提升泵站"}
          - {v: 卫生设施, code: sanitation, def: 厕所、洗手设施, boundary: "", example: "学校厕所"}
      - name: 其他
        values:
          - {v: 水利防洪, code: hydraulic, def: 灌溉、水坝、渠道、防洪, boundary: "", example: "灌渠衬砌"}
          - {v: 其他, code: other, def: 认不出的(设备、咨询、运营合同里没写对象的), boundary: "", example: "水表采购"}
  contractor_kind:
    name: 供应商性质
    used_by: [contractor.kind]
    note: 人补;机器不判断。
    groups:
      - name: 全部
        values:
          - {v: 国有企业, code: soe, def: 国家或地方政府控股的企业, boundary: 中央企业的子公司也算, example: "中国电建所属工程局"}
          - {v: 民营企业, code: private, def: 私人控股的企业, boundary: "", example: ""}
          - {v: 外资或国际企业, code: international, def: 跨国公司或其在当地的分支, boundary: 当地注册但由外国公司控股的也算, example: ""}
          - {v: 设计咨询机构, code: consultant, def: 设计院、咨询公司、监理单位, boundary: "", example: ""}
          - {v: 其他, code: other, def: 个人、联合体名义、非营利机构等, boundary: "", example: ""}
  study_kind:
    name: 研究资料类型
    used_by: [study.kind]
    note: 国别概况「水务历史资料」页签按这个顺序分组。
    groups:
      - name: 全部
        values:
          - {v: 综述, code: summary, def: "本系统读一国的研究资料后整理的要点(关键数字、机构、规划的投资、重点城市),每个数字注明出处与页码", boundary: 只整理原文说了的;推断单列并写明是推断, example: "摩洛哥水务市场:世行投资前资料要点"}
          - {v: 行业研究, code: sector_study, def: 不针对单个项目的行业研究、国别气候与发展报告、水安全诊断等, boundary: "", example: "Water Scarcity in Morocco"}
          - {v: 项目评估, code: appraisal, def: 项目批准前的评估文件(PAD)、政策贷款文件、项目信息文件、追加融资文件, boundary: 相当于可研摘要:建什么、在哪、多少钱、怎么招标, example: "Climate Resilient Water Services Project PAD"}
          - {v: 完成报告, code: completion, def: 项目结束后的完成报告(ICR)与后评价, boundary: "", example: "Rural Water Supply Project ICR"}
          - {v: 环境社会评估, code: safeguards, def: 环境影响评估、环境社会管理框架、体系评估、技术评估, boundary: 具体工程地点、规模、管线走向多在这里, example: "Environmental and Social Systems Assessment"}
  law_kind:
    name: 法规类别
    used_by: [law.kind]
    note: 比国别表「相关法律法规」的类别(reference/country_water.yaml)多「排放标准与技术规范」:出水限值、水质标准多在单独的部令或技术规范里。
    groups:
      - name: 全部
        values:
          - {v: 水法与水资源, code: water, def: 水法典、水资源法:用水许可、水体保护、流域管理, boundary: "", example: "摩洛哥第 36-15 号水法"}
          - {v: 供水、排水与污水, code: wss, def: 供水与排水服务、饮用水、污水收集处理的法律, boundary: 只定限值的部令归排放标准, example: "阿塞拜疆供水与废水法"}
          - {v: 排放标准与技术规范, code: standard, def: 规定排放限值、水质标准、取样测法的部令、技术规范与卫生规则, boundary: "", example: "摩洛哥生活污水排放限值部令"}
          - {v: PPP 与特许经营, code: ppp, def: 公私合作、特许经营、委托管理的法律, boundary: "", example: "摩洛哥第 86-12 号 PPP 法"}
          - {v: 公共采购, code: procurement, def: 政府采购、公共工程招标的法律法令, boundary: "", example: "吉尔吉斯斯坦政府采购法"}
          - {v: 环境与环评, code: env, def: 环境保护、环境影响评价、生态鉴定, boundary: "", example: "阿塞拜疆环境影响评价法"}
          - {v: 其他, code: other, def: 别的有关法规, boundary: "", example: ""}
  law_status:
    name: 现行状态
    used_by: [law.status]
    groups:
      - name: 全部
        values:
          - {v: 现行有效, code: in_force, def: 查到的最新信息是现行有效(可能修订过，版本说明里写收的是哪一版), boundary: "", example: ""}
          - {v: 已废止, code: repealed, def: 已被新法取代或废止, boundary: 留着作历史参考, example: ""}
          - {v: 待核实, code: unknown, def: 生效与否没查清, boundary: "", example: ""}
  concept_relation:
    name: 与通用概念的关系
    used_by: [local_term.relation]
    note: 本国定义和「行业术语」表里通用说法的关系;跨国比较时据此写明口径差别。
    groups:
      - name: 全部
        values:
          - {v: 相同, code: same, def: 范围和口径与通用说法一致, boundary: "", example: ""}
          - {v: 更窄, code: narrower, def: 本国定义只包含通用说法的一部分, boundary: "", example: "只算城镇生活污水，不含工业废水"}
          - {v: 更宽, code: broader, def: 本国定义比通用说法包含得多, boundary: "", example: "「废水」含雨水"}
          - {v: 部分重叠, code: overlap, def: 两边各有对方没有的部分, boundary: "", example: ""}
          - {v: 没有对应, code: none, def: 本国法规里没有这个概念，用的是别的办法, boundary: 差别说明里写它用的是什么, example: "不定全国统一出水限值，按受纳水体逐厂核定"}
  ask_verdict:
    name: 助手回答的反馈
    used_by: [ask_log.verdict]
    groups:
      - name: 全部
        values:
          - {v: 答对了, code: right, def: 提问的人看了觉得理解得对、答得对, boundary: "", example: ""}
          - {v: 答错了, code: wrong, def: 理解错了、查错了或答得不对, boundary: "数据缺(没收这国、没有估价)但助手说清楚了的不算答错", example: "问已中标项目,查成了线索"}
  ask_status:
    name: 错题处理状态
    used_by: [ask_log.status]
    groups:
      - name: 全部
        values:
          - {v: 待看, code: open, def: 答错了、还没人看, boundary: "", example: ""}
          - {v: 已修好, code: fixed, def: "程序或说法改好了,应理解为写上了对的理解", boundary: "每天复查,不通过的看「复查」", example: ""}
          - {v: 不改, code: wontfix, def: "看过了,不打算改(说法太含糊、数据本来就没有)", boundary: 不再复查, example: ""}
  review_kind:
    name: 复核条目类型
    used_by: [review.kind]
    groups:
      - name: 全部
        values:
          - {v: 要核实, code: verify, def: 助手分析时列出的要人核实的要点, boundary: "", example: 意向书截止日期(公告中可能截断未显示)}
          - {v: 库里线索, code: lead, def: 按项目名、地名搜到的、可能是同一项目的库里线索, boundary: 同一网址的线索不在此列(已经是同一条), example: Sumgayit Wastewater Treatment Plant Project}
  review_status:
    name: 复核处理
    used_by: [review.status]
    groups:
      - name: 人点的
        values:
          - {v: 已复核, code: reviewed, def: 人看过了、这一点没问题, boundary: 只用于要核实, example: ""}
          - {v: 已忽略, code: ignored, def: 人看过了、这一点不用管, boundary: 只用于要核实;页面划掉, example: ""}
          - {v: 是同一项目, code: same, def: 这条线索和材料讲的是同一个项目, boundary: 投标评估按「库里已有」算;助手判出的也记这种, example: ""}
          - {v: 不是同一项目, code: different, def: 这条线索和材料无关, boundary: 从相关里去掉;助手判出的也记这种, example: ""}
      - name: 助手做的
        values:
          - {v: 助手已核, code: checked, def: 「帮我复核」查过并给了结论, boundary: 人可以再点人的按钮覆盖;线索判为同项目别的标段也记这种, example: ""}
  phrase_kind:
    name: 语义层说法类别
    used_by: [phrase.kind]
    groups:
      - name: 全部
        values:
          - {v: 指标, code: measure, def: "助手能算的数(中标价、评标天数、供水得分……),对应 semantic.measures", boundary: "新指标要程序会算,改本体", example: 评标天数}
          - {v: 算法, code: agg, def: "合计、平均、中位数,对应 semantic.aggs", boundary: "", example: 中位数}
          - {v: 主体工程, code: asset, def: "已中标项目的主体工程(污水处理厂、管网……),对应 semantic.words.award_asset", boundary: "", example: 污水处理厂}
          - {v: 法规问法, code: law, def: "提问是在问排放标准、问定义还是问法规条文,对应 semantic.words.law", boundary: "", example: 问排放标准}
          - {v: 排放指标, code: param, def: "排放限值的指标(BOD5、COD……),对应 semantic.words.effluent_param", boundary: "", example: BOD5}
  extract_check:
    name: 核实状态(摘录)
    used_by: [local_term.verified, discharge_limit.verified]
    groups:
      - name: 全部
        values:
          - {v: 待核实, code: pending, def: 机器从条文摘出、人还没对过原文, boundary: 页面与助手标出, example: ""}
          - {v: 已核实, code: verified, def: 人对过原文, boundary: "", example: ""}
  effluent_param:
    name: 排放指标
    used_by: [discharge_limit.param]
    note: 助手认这些说法(semantic.words.effluent_param);原文用别的写法的照抄进原文指标。
    groups:
      - name: 有机物与固体
        values:
          - {v: BOD5, code: bod5, def: 五日生化需氧量, boundary: 原文写全生化需氧量(БПК полн.)的也记这里，原文指标照抄, example: ""}
          - {v: COD, code: cod, def: 化学需氧量, boundary: "", example: ""}
          - {v: 悬浮物, code: tss, def: 总悬浮固体(MES、TSS、взвешенные вещества), boundary: "", example: ""}
      - name: 营养盐
        values:
          - {v: 总氮, code: tn, def: 总氮, boundary: "", example: ""}
          - {v: 氨氮, code: nh4, def: 氨氮(铵), boundary: "", example: ""}
          - {v: 总磷, code: tp, def: 总磷(或磷酸盐折磷), boundary: "", example: ""}
      - name: 其他
        values:
          - {v: 粪大肠菌群, code: coliform, def: 粪大肠菌群、大肠杆菌, boundary: "", example: ""}
          - {v: pH, code: ph, def: 酸碱度, boundary: "", example: ""}
          - {v: 油脂, code: oil, def: 油脂、石油类、动植物油, boundary: "", example: ""}
          - {v: 其他, code: other, def: 别的指标(重金属、温度等), boundary: 原文指标照抄, example: ""}
  limit_basis:
    name: 限值口径
    used_by: [discharge_limit.basis]
    note: 同一国同一指标按口径分开列;口径不同的数不能直接比。
    groups:
      - name: 全部
        values:
          - {v: 出水浓度上限, code: effluent_max, def: 污水厂(或排放口)出水里不得超过的浓度, boundary: "", example: "BOD5 ≤ 120 mg/L"}
          - {v: 去除率下限, code: removal_min, def: 处理后至少要去除的比例, boundary: "", example: "BOD5 去除 ≥ 70%"}
          - {v: 受纳水体允许浓度, code: receiving_max, def: 河湖等受纳水体里允许的最高浓度(苏联体系的 ПДК)，出水能排多少按受纳水体逐厂核定, boundary: 不是出水限值, example: "渔业水体 BOD 全 ≤ 3 mg/L"}
          - {v: 排入管网上限, code: sewer_max, def: 企业排进城市管网时不得超过的浓度, boundary: "", example: ""}
  receiving_water:
    name: 排到哪里
    used_by: [discharge_limit.receiving]
    groups:
      - name: 全部
        values:
          - {v: 地表水, code: surface, def: 河流、湖泊、水库, boundary: "", example: ""}
          - {v: 海洋, code: sea, def: 海洋、海湾, boundary: "", example: ""}
          - {v: 地下水, code: ground, def: 渗入地下, boundary: "", example: ""}
          - {v: 城市管网, code: sewer, def: 排进城市排水管网, boundary: "", example: ""}
          - {v: 回用灌溉, code: reuse, def: 处理后回用、灌溉, boundary: "", example: ""}
          - {v: 不限, code: any, def: 原文没分排到哪里, boundary: "", example: ""}
  event_kind:
    name: 水务事件类别
    used_by: [water_event.kind]
    note: 大事记里按颜色区分;已中标项目由页面现算并入,不是这里的类别。
    groups:
      - name: 全部
        values:
          - {v: 项目批准, code: approved, def: 开发银行或政府批准一个水务投资项目或贷款, boundary: 追加融资也算, example: "世界银行批准吉尔吉斯斯坦气候韧性水务项目,1 亿美元"}
          - {v: 项目完成, code: closed, def: 项目关闭、完工或完成评价, boundary: "", example: "阿塞拜疆第二期国家供水项目关闭"}
          - {v: 机构改革, code: reform, def: "水务机构设立、合并、改组,水法与公用事业法,委托经营合同签订或终止", boundary: "", example: "成立国家水资源署"}
          - {v: 规划与政策, code: plan, def: 国家或城市的水务规划、计划、战略与目标出台, boundary: "", example: "《国家饮用水与灌溉计划 2020–2027》"}
          - {v: 水价调整, code: tariff, def: 水价、污水费、水资源费的调整, boundary: "", example: "水价上调约 87%"}
          - {v: 工程投运, code: works, def: 有名字的水厂、坝、调水、管线、淡化厂开工或投运, boundary: "", example: "某海水淡化厂投运"}
          - {v: 其他, code: other, def: 旱灾、水危机等其他有日期的大事, boundary: "", example: ""}
  company_owner:
    name: 公司资料归属
    used_by: [company.owner]
    note: 空 = 本单位。只有本单位的行才会附进报告。
    groups:
      - name: 全部
        values:
          - {v: 本单位, code: own, def: 我们公司自己的资质或业绩, boundary: 合同主体是本单位, example: "中海外承建的供水项目"}
          - {v: 兄弟单位, code: sibling, def: "集团内其他单位的业绩,只做记录、供参考", boundary: 不能当作本单位业绩投标或写进报告, example: "中铁一局承建的污水厂"}
          - {v: 合作方, code: partner, def: 合作伙伴、联合体成员的资质或业绩, boundary: "同上,只做记录", example: "联合体伙伴的运营业绩"}
  company_kind:
    name: 公司资料类别
    used_by: [company.kind]
    note: 一行一项。
    groups:
      - name: 全部
        values:
          - {v: 资质, code: qualification, def: 资质证书、许可、认证, boundary: "", example: "市政公用工程施工总承包特级"}
          - {v: 业绩, code: track_record, def: 已完成或在建的项目业绩, boundary: 一行一个项目, example: "某国净水厂 EPC(2023)"}
          - {v: 其他, code: other, def: 公司简介、财务指标、团队等, boundary: "", example: "公司简介(中英文)"}
  role:
    name: 成员角色
    used_by: [member.role]
    note: 在 Teable 空间里设;页面写入沿用表格权限。
    groups:
      - name: 全部
        values:
          - {v: 管理员, code: admin, def: 建表、管信源与成员, boundary: "", example: ""}
          - {v: 跟进人, code: editor, def: 改商机、记跟进、处理线索, boundary: "", example: ""}
          - {v: 只读, code: viewer, def: 只看, boundary: "", example: ""}

# 口径与术语(glossary):页面、报告、表格视图共用，只定一次(R14)。stages 引用 taxonomies.stage 的值，tests 检查都存在。
glossary:
  risk_level:
    term: 水风险分数怎么读
    means: "Aqueduct 的 0–5 分:0–1 低,1–2 低到中,2–3 中到高,3–4 高,4–5 极高;用水压力 4 分以上 = 取用量超过可用量的 80%。分数是模型估计,不是实测"
    used_in: [城市概况, 国别概况, 趋势机会]
  trend_self_funded:
    term: 自付型机会(趋势)
    means: "城市水风险(缺省 = 总体水风险)≥ 4 分(极高)且人均 GDP(PPP)≥ 2 万美元:缺水或水质差、当地也付得起,项目多半自筹或 PPP。两个门槛页面上可调"
    used_in: [趋势机会]
  trend_loan_driven:
    term: 贷款型机会(趋势)
    means: "城市水风险 ≥ 4 分(缺省),且所在国别近年有开发性贷款进水务:世行涉水项目数 ≥ 1,或最近一年本库里出资方属开发性金融(世行、亚行、亚投行、非开行、欧复行、欧投行、伊开行、美开行、欧佩克基金、法开署、德复兴银行)的线索 ≥ 3 条。贷款按国家批,这一类按国别判,城市沿用;门槛页面上可调"
    used_in: [趋势机会]
  tracked:
    term: 跟踪中的商机(在跟踪)
    means: 我方阶段 ∈ 跟踪中、准备投标、已投标、中标;即不是 建议、不跟进、未中标、放弃，也不是空;且没勾「已归档」(archived_opp)
    stages: [跟踪中, 准备投标, 已投标, 中标]
    used_in: [线索总览卡片「跟踪中的商机」, 漏斗第四级, 日历缺省范围, 商机总览缺省, 周报月报的「未来 N 天时间节点」范围, 「商机总览 · 下一步已逾期」]
    code: portal.js P.tracked;core/jobs/reports.py build_periodic 的 tracked
  decided:
    term: 已立项的商机(人定过的)
    means: 我方阶段 ∉ 未立项(建议、不跟进)，即人确认跟踪过的:跟踪中、准备投标、已投标、中标，加上已结束的未中标、放弃;且没勾「已归档」(archived_opp)。「商机跟进」各页只算这些;AI 推荐的在人确认之前不进这一步(使用方 2026-10-16)
    stages: [跟踪中, 准备投标, 已投标, 中标, 未中标, 放弃]
    used_in: [「商机总览」三页与其筛选数字、新线索提醒]
    code: portal.js P.decided
  archived_opp:
    term: 已归档的商机
    means: 商机勾了「已归档」(人点「放弃跟踪」,A50)。tracked、decided 两个口径都不含它;商机总览、日历、报告页选商机、国别概况、首页与助手默认不算,说明行「已归档 N 个商机 · 显示」(网址 ar=1)点开才算;商机工作台点开仍看全部,并有「恢复跟踪」(使用方 2026-10-20)
    stages: []
    used_in: [商机总览说明行, 商机工作台顶上的说明与「恢复跟踪」]
    code: portal.js P.isArchived / P.oppArcNote;core/jobs/brief.py、reports.py、calendar_feed.py 的 is_archived
  ai_suggested:
    term: AI 推荐的商机
    means: 我方阶段 = 建议;机器新建的、人还没定跟不跟的商机。表格视图名仍是「建议商机」，页面统一叫 AI 推荐
    stages: [建议]
    used_in: [线索总览卡片, 「线索处理」第二页, 国别报告的项目机会清单]
  pending_leads:
    term: 待处理线索
    means: 是否相关 = 是 且 处理状态 = 待处理
    used_in: [线索总览卡片, 表格视图「待处理」]
  to_assign:
    term: 待确认归属
    means: 所属商机为空，且(建议所属商机非空 且 处理状态 ≠ 已忽略)或(可能是新项目 = 是 且 处理状态 = 待处理)
    used_in: [线索总览卡片, 表格视图「待确认归属」, 「线索处理」第一页]
  overdue:
    term: 下一步已逾期
    means: 商机在跟踪(tracked)且 下一步到期 < 今天(页面按当前日期算，R12)
    stages: [跟踪中, 准备投标, 已投标, 中标]
    used_in: [「商机总览 · 下一步已逾期」]
  review:
    term: 待核更新
    means: 商机.待核更新 非空(去掉行首 ✗ 的驳回行后仍有内容);一行一条机器提议
    used_in: [「商机总览 · 待核更新」, 表格视图「待核更新」, 商机工作台的提示]
  core_sectors:
    term: 核心领域
    means: 线索领域 ∈ 供水、污水、海水淡化、雨水排涝、水环境;profile 的 sector_scope 开了灌溉排水或防洪流域时加上水利
    sectors: [供水, 污水, 海水淡化, 雨水排涝, 水环境]   # 代码读这里(core/jobs/suggest.py CORE_SECTORS)
    used_in: [机器新建建议商机的门槛(A06)]
  threshold:
    term: 建议商机门槛
    means: 国别市场分级 ∈ 重点、市场 且 领域含核心领域 且 类别 ∈ 招标、意向书、资格预审、总采购公告、特定采购公告、融资、立项或规划;模型判为新项目且过门槛才新建，否则只勾「可能是新项目」等人定
    categories: [招标, 意向书, 资格预审, 总采购公告, 特定采购公告, 融资, 立项或规划]   # 代码读这里(core/jobs/suggest.py NEW_OPP_CATEGORIES)
    tiers: [重点, 市场]
    used_in: [A06]
  lead_no:
    term: 线索号
    means: 信源 + 原文键的指纹前 8 位(十六进制);正文里的 [线索号] 在页面上显示为角标 ①②③，点开是那条线索
    example: 3f9a1c2e
  opp_code:
    term: 商机编号
    means: ISO3-三位序号，序号 = 该国已有最大序号 + 1;机器与页面新建都按这个取，不复用已删或不跟进的号
    example: AZE-003
  pdate:
    term: 日期原文
    means: 时间节点的日期可以不精确:2026 / 2026-H2 / 2026-Q4 / 2026-12 / 2026-12-15;「日期」字段存区间起点，原文另存一列
  r_ref:
    term: R 号
    means: 国别成稿里的条目号〔R012〕，出现在国别的市场准入等列表里;只提示出处，不跳转(不是线索号)

# 行业术语的初始词(terms,v2.11 起):Teable「行业术语」表(对象 term)建好时写进表的几行;表没建或读不到时助手用这里兜底。
# 平时加词、改相关词在表里改,不改这里。字段含义见对象 term:aliases 同义说法、covers 跨哪些领域、sectors 按领域筛(空 = 不限领域)、match 相关词、means 说明。
# 语义层(semantic,v2.21 起;使用方 2026-10-13 问「中标金额与招标金额什么比例」「平均评标时间多长」,助手认不出,问要不要加语义层):
# 助手能算的指标(measures)、算法(aggs)和分类值的口语(words)。助手解析提问时只从这里挑,页面照这里算;加一个指标、一种说法改这里,不用改程序。
# measures:of 哪些对象有;field 取哪个属性(两个属性的是前一个除以后一个);unit 单位(数量按对象);aggs 可用的算法,第一个是缺省;
#   needs 这几项都有值的才算得出;missing 缺数时页面照写(说清哪些来源没有);words 提问里的说法(中文直接包含,拉丁词按整词;说了这些词的一律查 of 里的第一个对象,除非提问明说了别的)。
# aggs:算法与说法。页面的卡片先给问的算法,另附中位数或平均、中间一半落在哪、有数据的几份。
# words:分类值的口语(提问里的说法 → 值),按分类体系分;页面按属性的值筛,不按名称里的字。
semantic:
  measures:
    - id: count
      name: 数量
      of: [lead, opportunity, milestone, report, award, country]
      unit: {lead: 条, opportunity: 个, milestone: 个, report: 份, award: 份, country: 国}
      aggs: [count]
      words: []
    - id: amount
      name: 中标价
      of: [award]
      field: price_cny
      unit: 万元
      aggs: [sum, median, mean]
      needs: [price_cny]
      missing: 没有中标价或还没折算成人民币的不算(折算由后台按汇率补)
      words: [合计金额, 金额合计, 总金额, 中标总额, 合同总额, 总额, 平均金额, 平均中标价, 平均合同额, 中标价中位数, 金额中位数, 一般多少钱, 通常多少钱, 多少钱]
    - id: price_ratio
      name: 中标价 / 招标估价
      of: [award]
      field: [price, estimate]
      unit: "%"
      aggs: [median, mean]
      needs: [price, estimate]
      missing: 只有本国采购网的记录有招标估价(摩洛哥 2024 年 10 月以来截标的大部分、吉尔吉斯斯坦);世界银行、亚洲开发银行、欧洲复兴开发银行的记录不公布估价
      words: [招标金额, 招标价, 招标价格, 招标额, 招标估价, 招标预算, 估价, 预估价, 估算价, 预算价, 预算金额, 控制价, 最高限价, 拦标价, 标底, 计划金额, 概算, 下浮率, 下浮, 降幅, 折扣率, 中标比例, estimate, budget]
    - id: eval_days
      name: 评标天数
      of: [award]
      field: eval_days
      unit: 天
      aggs: [median, mean]
      needs: [eval_days]
      missing: 摩洛哥、吉尔吉斯斯坦本国采购网的记录大多有;世界银行贷款的只有授标公告写了截标日期的那部分(按截标到授标公告算,偏长);亚洲开发银行、欧洲复兴开发银行的记录没有开标、定标日期
      words: [评标时间, 评标时长, 评标周期, 评标天数, 评标用时, 评标要多久, 评标多久, 定标时间, 定标周期, 开标到定标, 开标到授标, 截标到授标, 多久定标, 多久出结果, 评审时间, 评审周期, 评标]
    - id: bidders
      name: 投标家数
      of: [award]
      field: bidders
      unit: 家
      aggs: [median, mean]
      needs: [bidders]
      missing: 摩洛哥、吉尔吉斯斯坦本国采购网与世界银行贷款的记录大多有;亚洲开发银行、欧洲复兴开发银行的记录不列投标人
      words: [投标家数, 投标人数, 投标单位数, 几家投标, 多少家投标, 参与投标, 竞标家数, 竞争者数量, 竞争激烈]
    # 营商环境(世界银行 B-READY,v2.23):国别一国一个数,页面列国别表(按问的指标排序,写明有数据的几国、没覆盖的几国),卡片给中位数或平均;
    # better 说这个数越大越好(high)还是越小越好(low),页面据此读「最好 / 最差」
    - id: bready_total
      name: 营商环境总分
      of: [country]
      field: bready_total
      unit: 分
      aggs: [median, mean]
      needs: [bready_total]
      better: high
      missing: 世界银行 B-READY 2025 只评了 101 个经济体,我们的国别里有数的约 66 国;埃及、印度、沙特、巴西等这一期没有
      words: [营商环境总分, 营商环境得分, 营商环境分数, 营商环境, 营商得分, 营商指数, b-ready, bready, business ready]
    - id: bready_water
      name: 供水得分
      of: [country]
      field: bready_water
      unit: 分
      aggs: [median, mean]
      needs: [bready_water]
      better: high
      missing: 同营商环境总分(B-READY 2025 没覆盖的国家没有)
      words: [供水得分, 供水分数, 供水评分, 供水监管得分, 供水营商环境, 水务监管得分, 供水服务得分]
    - id: bready_procure
      name: 公共采购得分
      of: [country]
      field: bready_procure
      unit: 分
      aggs: [median, mean]
      needs: [bready_procure]
      better: high
      missing: 同营商环境总分(B-READY 2025 没覆盖的国家没有)
      words: [公共采购得分, 公共采购评分, 采购得分, 采购评分, 招投标得分, 招标环境, 采购环境, 投标环境, 招投标环境, 公共采购环境]
    - id: bready_dispute
      name: 纠纷解决得分
      of: [country]
      field: bready_dispute
      unit: 分
      aggs: [median, mean]
      needs: [bready_dispute]
      better: high
      missing: 同营商环境总分(B-READY 2025 没覆盖的国家没有)
      words: [纠纷解决得分, 纠纷解决, 商事纠纷, 争议解决, 合同纠纷]
    - id: water_tariff_usd
      name: 商业水价
      of: [country]
      field: water_tariff_usd
      unit: 美元/m³
      aggs: [median, mean]
      needs: [water_tariff_usd]
      better: low
      missing: B-READY 2025 没覆盖的国家没有;覆盖了的个别国家专家填的数不合常理(折合每立方米不到 3 美分或超过 15 美元),没有采用
      words: [商业水价, 工业水价, 企业水价, 商业水费, 水价, 水费, water tariff]
    - id: water_reliable
      name: 企业供水可靠比例
      of: [country]
      field: water_reliable
      unit: "%"
      aggs: [median, mean]
      needs: [water_reliable]
      better: high
      missing: 来自世行企业调查,B-READY 2025 没覆盖的国家与个别没做调查的国家没有
      words: [企业供水可靠比例, 供水可靠比例, 供水可靠, 企业缺水, 缺水的企业, 缺水企业, 企业停水, 供水不足, 缺水]
    - id: water_conn_days
      name: 接水天数
      of: [country]
      field: water_conn_days
      unit: 天
      aggs: [median, mean]
      needs: [water_conn_days]
      better: low
      missing: 来自世行企业调查,约五分之一的国家没有这项
      words: [接水天数, 接水要多久, 接水时间, 供水接入时间, 接入供水, 接水]
    - id: award_days
      name: 大型工程授标天数
      of: [country]
      field: award_days
      unit: 天
      aggs: [median, mean]
      needs: [award_days]
      better: low
      missing: B-READY 专家估计;约四分之一的国家只有半数专家作答(细项里注明),没覆盖的国家没有。实际合同的评标天数问「评标天数」(已中标项目)
      words: [大型工程授标天数, 工程授标天数, 授标天数, 授标要多久, 授标周期, 招标周期, 采购周期, 招标流程要多久, 招标流程多久]
    - id: gov_pay_days
      name: 政府合同回款天数
      of: [country]
      field: gov_pay_days
      unit: 天
      aggs: [median, mean]
      needs: [gov_pay_days]
      better: low
      missing: 来自世行企业调查,B-READY 2025 没覆盖的国家没有
      words: [政府合同回款天数, 政府回款, 回款天数, 回款周期, 回款, 付款周期, 付款天数, 政府付款, 账期, 收款周期]
  aggs:
    - {id: count, name: 数量, words: []}
    - {id: sum, name: 合计, words: [合计, 总共, 总额, 一共, 加起来, 总计, 累计]}
    - {id: mean, name: 平均, words: [平均, 均值, average, mean]}
    - {id: median, name: 中位数, words: [中位数, 中位, 一般, 通常, 常规, 典型, median]}
