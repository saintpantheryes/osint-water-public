changes_v2_24:   # 法规原文、国别定义与排放标准(2026-10-14):使用方问抓到的法律法规有没有做文字识别、能不能直接问「摩洛哥或阿塞拜疆的污水厂排放标准」;
                 # 当时国别表只存每部法规一行名称与链接,助手答不了。使用方的思路:法规原文识别入库,里面的词放进语义层,各国对同一类事物的定义不完全一致,涉及一国的按这国的定义;排放标准也在内。选先做摩洛哥、阿塞拜疆、吉尔吉斯斯坦三国试点
  - 新增公开对象「法规」(law):一部法律、法令、部令或技术规范一行:名称、原文名称、类别(新分类体系 law_kind,比国别表的法规类别多「排放标准与技术规范」)、文号、颁布日期、现行状态(law_status)、
    版本说明、语言、所属国别、原文链接、取自、要点、条文数(派生)、编号、备注。国别表「相关法律法规」那几行是简表,照旧保留
  - 新增公开对象「法规条文」(law_clause):一条(或一节、一张附表)一行:条号、顺序、所在章节、原文、中文、页码、所属法规、所属国别。原文按「第 N 条 / Article / Статья / Maddə」拆开;扫描件先做文字识别
  - 新增公开对象「国别定义」(local_term):一个通用概念在一国法规里怎么定义:通用概念(「行业术语」表里的一个术语,即语义层的词)、原文用词、本国说法、本国定义、定义原文、与通用概念的关系(concept_relation:相同、更窄、更宽、部分重叠、没有对应)、
    差别说明、出处条文、所属法规、核实状态(extract_check:待核实、已核实,人改)
  - 新增公开对象「排放限值」(discharge_limit):一国一部法规里一个指标的一个限值:指标(effluent_param:BOD5、COD、悬浮物、总氮、氨氮、总磷、粪大肠菌群、pH、油脂、其他)、原文指标、限值、限值原文、单位、
    口径(limit_basis:出水浓度上限、去除率下限、受纳水体允许浓度、排入管网上限)、排到哪里(receiving_water)、适用范围、取样与测法、出处条文、所属法规、核实状态
  - 行业术语表加通用概念(排放标准、生活污水、城镇污水、污水处理厂、受纳水体、二级处理、敏感区):本体 terms 节是初始词,表里照样由懂行的人改
  - 新增行为 A37 导入法规与条文(命令行;后台给没有中文的条文补译):私有配置仓 data/laws.csv、data/law_clauses.csv.gz,由 scripts/fetch_laws.py 按法规清单取原文、转文字(扫描件识别)、按条拆开
  - 新增行为 A38 补录法规(人,表格);A39 摘录国别定义与排放限值(命令行:读条文摘出的 data/local_terms.csv、data/discharge_limits.csv,只新建、只填空,核实状态初值「待核实」);A40 核实国别定义与排放限值(人,表格)
  - 国别概况(V7)「机构与法规」页签:原来的机构、国企、法规简表下面加「法规原文」(这国的法规,点开看全文:条文中文与原文对照)、「排放标准」(按法规列限值,注明口径、排到哪里、出处条号,待核实的标出)、
    「本国定义」(通用概念、本国说法与定义、和通用说法的差别);新增视图 V21 法规全文(不进菜单)
  - 助手认法规问题(新对象「法规」):问排放标准(「摩洛哥污水厂排放标准是多少」「阿塞拜疆污水厂排放标准」「那吉尔吉斯斯坦呢」)按国别列排放限值表,同一国几种口径分开列,写明出处条号、待核实的标出;
    跨国比的写明口径差别(有的国家定的是出水上限,有的定的是受纳水体允许浓度);问定义(「阿塞拜疆法律里污水怎么定义」)列本国定义;别的法规问题(「摩洛哥特许经营最长多少年」)按国别与关键词查条文,
    配了模型的请它只按查到的条文作答、每句带出处角标,没配模型的列出条文;库里没有这国法规原文的直说没有,不说成没有规定
  - 游客通道放行(示例数据里编一部示例法规)
  - 要跑一次建表命令(新表、新选项)
changes_v2_23:   # 营商环境(世界银行 B-READY,2026-10-14):使用方问 B-READY 对国别分析有没有帮助、怎么融入系统;看了评估后选「照方案做」
