  - id: A28
    name: 导入已中标项目
    actor: ai
    channel: [命令行, 后台]
    trigger: 一次性(python -m core.jobs.awards;数据文件换了再跑一次);后台每个周期给没有中文名的补一批中文名
    reads: [country, city]
    creates: award
    writes: [award.name, award.name_zh, award.sector, award.contract_type, award.delivery, award.asset, award.price, award.estimate, award.eval_days, award.bidders, award.currency, award.awarded, award.quantity, award.winner, award.winner_country,
             award.project, award.funder, award.method, award.buyer, award.country, award.city, award.source, award.url, award.winners,
             contractor.name, contractor.nationality, contractor.nationality_code, contractor.ext_ids]
    note: "数据文件是私有配置仓 data/ 下的 awards*.csv.gz,一个来源一份,都读。awards.csv.gz 由 scripts/fetch_wb_awards.py 从世界银行 Finances One 的「投资项目合同授予」数据(STEP 系统,借款国录入)取:
      项目属水务实践的,合同名称里有水务字样;农业、防灾、城市等别的项目里的(灌渠、水坝、防洪堤、农村供水常在这些项目下),名称要有明确的水务工程字样、且没有道路、学校、电力、种子之类字样;10 万美元以上;同一合同号的多行(联合体各家)并成一行,金额不同的各家相加。只留国别表里有的国家。
      awards_wb_old.csv.gz 由 scripts/fetch_wb_old_awards.py 从世行项目网站的合同检索接口取 2019 年以前签的(STEP 数据之前,2000 年前后起,多是事前审查的大合同;编号与 STEP 同一套),挑法同上;
      早年名称常很短,水务项目里名称归不了类的工程(办公楼、培训除外)、管材泵阀类货物、设计监理类咨询按项目名称归类;个人咨询顾问不收;读坏的名称(UTF-8 当 cp1252 读)还原。按国别取(使用方 2026-10-14 问阿塞拜疆为什么只有 5 份:世行在那里的水务贷款 2017 年前就花完了)。
      awards_mar.csv.gz 由 scripts/fetch_ma_awards.py 从摩洛哥公共采购网的结果公告取:标题有法文水务词、没有道路电力等字样的;中标单位与金额从公告附件读(扫描件转正后文字识别,配置的模型只读原文写着的、金额要在原文里找得到;也可看原件小图读),
      读不准的不收;100 万迪拉姆以上;一张结果表挂在几条公告上的只收一次;采购方、执行地点(认城市用)、附件里写明的外部出资方一并记下;供应商注册国只在名称看得出时写(中国企业名称、摩洛哥的 SARL)。
      招标估价:门户的「全部公告」清单(只回溯到 2024 年 10 月以来截标的)里按同一机构、同一编号找原招标公告(标题、业主相近,截标在结果公布之前),读详情页的「Estimation (en Dhs TTC)」,分标段的按标段号对上;框架合同(给最低、最高价的)不写。
      awards_adb.csv.gz 由 scripts/fetch_adb_awards.py 从亚行 adb.org 招标页的检索服务取「已授合同」(2015 年起,金额为美元),awards_ebrd.csv.gz 由 scripts/fetch_ebrd_awards.py 从 EBRD 采购门户 ECEPP 的授标公告取(2016 年起,各标段一行,金额按原币种):项目名称或业主像水务的(供水、污水、灌溉、防洪、各国水务公司),合同名称、说明或项目名称归得进类别、合同名称没有车辆房屋之类字样;别的项目过更严的词;折合 10 万美元以上;联合体拆成各家,注册国按地址(名称看得出是中国企业的记中国);同一合同登了几次的只收一次;亚行按「职位名 + 人名」剔除个人咨询顾问。
      awards_kgz.csv.gz 由 scripts/fetch_kg_awards.py 从吉尔吉斯斯坦国家采购门户的中标单位表取(2015 年起,整表翻页):采购名称、标段名称有俄文或吉尔吉斯文水务词、没有学校道路电力之类字样;折合 10 万美元以上;
      合同金额不到计划金额 5% 或超过 5 倍的不收(多半是单价);计划金额记作招标估价;业主从公告详情页取。
      只新建、只填空(R2),去重按编号;别的来源(非行等)整理成同样的列也能导入。城市名不计重音(Kénitra = Kenitra)。承包模式按名称与采购方式认(见 award_delivery),已有的行补空。招标估价只在中标价是它的 0.3–2 倍时写(出了这个范围多半是标段没对上)。主体工程按名称认(见 award_asset),已有的行补空。
      数据文件可另带 estimate、eval_days、bidders、asset 列(有就填空);评标天数、投标家数与摩洛哥的招标估价 2026-10-13 按门户开标记录、详情页与世行授标公告补过一次,导入脚本还没接这几步。中文名:配了模型时后台每个周期译 40 条(工程量空着的顺带从名称里摘),没配就留空、人可补。"
    rules: [R2]
