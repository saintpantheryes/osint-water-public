  - id: A37
    name: 导入法规与条文
    actor: ai
    channel: [命令行, 后台]
    trigger: 法规清单或原文换了以后跑一次(python -m core.jobs.laws);后台每个周期给没有中文的条文补译一批(配了模型时)
    reads: [country]
    creates: law_clause
    writes: [law.name, law.name_orig, law.kind, law.number, law.issued, law.status, law.version, law.language, law.country, law.url, law.source, law.summary,
             law_clause.label, law_clause.seq, law_clause.heading, law_clause.text, law_clause.text_zh, law_clause.page, law_clause.law, law_clause.country]
    note: "数据文件在私有配置仓:data/laws.csv(一部法规一行)与 data/law_clauses.csv.gz(一条一行),由 scripts/fetch_laws.py 按清单(data/law_sources.csv:国别、名称、原文网址、语言)取原文:
      PDF 取文字层,没有文字层的(扫描件)用文字识别(tesseract,法、俄、英、阿拉伯文);网页取正文。按「第 N 条 / Article N / Статья N / Maddə N / المادة」拆条,附表单成一条;
      法规先建(只新建、只填空),条文挂到法规上。中文:后台每个周期译一批(不思考的便宜模式),只填空。原文网站从服务器打不开的,人在本机下载后放进清单写的位置。"
    rules: [R2]
  - id: A38
    name: 补录法规
    actor: human
    channel: [表格]
    trigger: 随时(在表格「法规」里加一行或改一行;条文可在「法规条文」里补)
    creates: law
    writes: [law.name, law.name_orig, law.kind, law.number, law.issued, law.status, law.version, law.language, law.country, law.url, law.source, law.summary, law.note,
             law_clause.label, law_clause.seq, law_clause.heading, law_clause.text, law_clause.text_zh, law_clause.page, law_clause.law, law_clause.country]
    note: 至少填名称、类别、所属国别;原文要进条文表的,把原文网址告诉管理员加进法规清单再跑 A37。
    rules: [R13]
  - id: A39
    name: 摘录国别定义
    actor: ai
    channel: [命令行]
    trigger: 读完一国的条文后跑一次(python -m core.jobs.laws 同时导入)
    reads: [country, law, law_clause, term]
    creates: local_term
    sets_on_create: {local_term.verified: 待核实}
    writes: [local_term.concept, local_term.term_orig, local_term.term_zh, local_term.definition, local_term.definition_orig, local_term.relation, local_term.difference,
             local_term.country, local_term.law, local_term.clause]
    note: "数据文件 data/local_terms.csv:读条文时把「行业术语」里通用概念(排放标准、生活污水、污水处理厂、受纳水体……)在这国法规里的定义摘出来,
      原文用词与定义原文照抄,出处写法规编号与条号;只新建、只填空(R2),通用概念不在术语表里的照样导入并提示。"
    rules: [R2]
  - id: A40
    name: 摘录排放限值
    actor: ai
    channel: [命令行]
    trigger: 读完一国的条文后跑一次(python -m core.jobs.laws 同时导入)
    reads: [country, law, law_clause]
    creates: discharge_limit
    sets_on_create: {discharge_limit.verified: 待核实}
    writes: [discharge_limit.param, discharge_limit.param_orig, discharge_limit.value, discharge_limit.value_text, discharge_limit.unit, discharge_limit.basis,
             discharge_limit.receiving, discharge_limit.scope, discharge_limit.sampling, discharge_limit.country, discharge_limit.law, discharge_limit.clause]
    note: "数据文件 data/discharge_limits.csv:读排放标准类法规的条文与附表摘出,数字照原文(原文是区间或带条件的照抄进限值原文);只新建、只填空(R2)。"
    rules: [R2]
  - id: A41
    name: 核实国别定义与排放限值
    actor: human
    channel: [表格]
    trigger: 随时(在表格「国别定义」「排放限值」里对着出处条文核对)
    writes: [local_term.verified, local_term.note, local_term.definition, local_term.relation, local_term.difference,
             discharge_limit.verified, discharge_limit.note, discharge_limit.value, discharge_limit.value_text, discharge_limit.scope]
    note: 对过原文把核实状态改「已核实」;机器摘错的直接改,改过的机器不再动(R2);页面和助手把「待核实」的标出来。
    rules: [R13]
  - id: A42
    name: 维护语义层说法
    actor: human
    channel: [表格]
    trigger: 随时(在表格「语义层说法」里加说法、删说法)
    writes: [phrase.target, phrase.kind, phrase.words, phrase.note]
    note: 助手每分钟重读一次这张表;表里有这一行的按表里的说法认,没有的用本体 semantic 节的初始说法。删掉整行,下个周期按本体补回初始说法;要助手不认某个说法,把它从「说法」里删掉。
    rules: [R13]
  - id: A43
    name: 补齐语义层说法
    actor: ai
    channel: [后台]
    trigger: 后台每个周期
    reads: [phrase]
    creates: phrase
    sets_on_create: {phrase.target: 本体里的指向名, phrase.kind: 类别, phrase.words: 本体初始说法, phrase.note: 指向的含义}
    note: 本体 semantic 节里有、表里还没有的指向(类别 + 指向)补一行;只新建,不改已有的行(R2)。表没建时跳过。
    rules: [R2]
  - id: A44
    name: 记助手提问
    actor: ai
    channel: [后台]
    trigger: 有人在助手里问了一句(游客除外;表没建时不记)
    creates: ask_log
    writes: [ask_log.question, ask_log.key, ask_log.prev_q, ask_log.understood, ask_log.parsed_by, ask_log.asker, ask_log.asked_at]
    note: 助手接口另起线程写,不拖慢回答;只新建(R2)。
    rules: [R2]
  - id: A45
    name: 反馈助手的回答
    actor: human
    channel: [页面]
    trigger: 答案下面点「答对了」或「答错了」(答错了可写一句哪里不对)
    writes: [ask_log.verdict, ask_log.note, ask_log.result, ask_log.status, ask_log.expected, ask_log.learned]
    note: 经助手接口写(查看者帐号也能反馈)。答对了:应理解为空着的抄这次的理解为;答错了:处理状态空着的记「待看」。改好之后由人写应理解为、改「已修好」;不打算改的标「不改」,不再复查。
      答错了又写了哪里不对的,当场按这句说明重答;对重答点「答对了」的,原来那一问写「学到的解析」、状态「待看」改「已修好」,马上生效(v2.27)。
    rules: [R13]
  - id: A46
    name: 复查错题本
    actor: ai
    channel: [后台]
    trigger: 每天本地 08:40 以后一次(系统 08:00 自动更新之后);也可命令行 python -m core.ask_log recheck
    reads: [ask_log]
    writes: [ask_log.recheck]
    note: 应理解为不空、处理状态不是「不改」的提问重问一遍(接着问的先问上一问);理解为逐项比,值里带具体日期的一项不比(天天变)。结果是机器自己的运行状态,每天覆盖(R2 的例外)。
    rules: [R2]
  - id: A47
    name: 复核助手的结论
    actor: human
    channel: [页面]
    trigger: 助手看完一条链接或一份文件,「要核实」每条后面点「已复核」「忽略此项」,「库里可能是同一项目」每条线索后面点「是同一项目」「不是同一项目」
    creates: review
    writes: [review.key, review.material, review.project, review.kind, review.item, review.lead_id, review.status, review.who, review.at]
    note: 经助手接口写(同编号已有就改这一行;人的点选可以覆盖助手的)。点了马上按全部点选重算投标评估:是同一项目的线索算「库里已有」,否定、忽略的从相关里去掉。
      按钮是页面操作,不进模型的输入。表没建时点选只在这一页有效,页面写明。
    rules: [R13]
  - id: A48
    name: 帮我复核
    actor: ai
    channel: [页面]
    trigger: 「要核实」或「库里可能是同一项目」的一条后面点「帮我复核」
    reads: [lead]
    creates: review
    writes: [review.key, review.material, review.project, review.kind, review.item, review.lead_id, review.status, review.conclusion, review.evidence, review.facts, review.who, review.at]
    note: 后台任务:要核实的点 → 整国世行公告按编号、名字比对、新闻旁证,请模型给结论、把握和核出的事实(截止日、阶段、金额、门槛),记「助手已核」,核出的事实补进评估重算;
      库里线索 → 请模型把线索和材料对一对,同一项目 / 不同项目直接记那两种,别的标段记「助手已核」仍列作相关。没查到也给有依据的判断并注明是推断(10-16 规则:不把「先核实」推回给人)。
    rules: [R2]
  - id: A49
    name: 过期线索归档
    actor: ai
    trigger: 每天零点后第一个周期(后台,与 A19 同一轮)
    reads: [lead]
    writes: [lead.archived, lead.archive_reason, lead.archived_at]
    note: "没标归档、也没归档时间的线索里:最近截止 < 今天的记「截止已过」;发布日期(没有按发现时间)早于一年前且所属商机为空的记「超过一年」。只标记,不删、不改处理状态(R13)。人勾掉「已归档」后归档时间还在,机器不再打回。R2 的例外(机器维护的运行状态),同 A19。"
    rules: [R2, R13]
  - id: A50
    name: 放弃跟踪(归档商机)
    actor: human
    trigger: 商机工作台点「放弃跟踪」(二次确认,可写一句原因)
    reads: [opportunity]
    writes: [opportunity.stage, opportunity.archived, opportunity.archive_reason, opportunity.archived_at, followup.stage_change]
    note: "在跟踪的改阶段为「放弃」(已结束的未中标 / 放弃不改),勾「已归档」,记原因与当天日期,留一条跟进「放弃跟踪:原因」(阶段变更 = 放弃)。不删,所属线索不动,点开仍看全部。
      「恢复跟踪」反过来:去掉已归档,「放弃」的改回「跟踪中」,再留一条跟进。已归档的商机在商机跟进各页、首页、助手、后台报告默认不算(glossary.archived_opp)"
    rules: [R5, R6]
rules:
  - id: R1
    name: 一个对象只存一处
    text: 每种对象只在一个地方保存(Teable);别处只能读取或展示，不能各存一份再互相同步。
    enforce: 机器任务直接读写 Teable;自建页面只读;git 只放程序与配置
    why: 现在一个商机散在 6 处，只能靠同步保持一致，这是"要等 30 秒""数据逻辑不清"的直接原因
  - id: R2
    name: 人写的不被机器覆盖
    text: 属性分机器写、人写、派生三类。机器只写机器写的属性，而且只填空值、只新建记录、列表只追加(列表类属性可追加新项，不改不删已有项);要改已有值时写进「待核更新」，等人确认后由人改。例外只有两类，可直接更新:机器自己的运行状态(信源最近采集与状态、报告生成状态)，按期替换的数据(国别指标，带年份与来源)。
    note: 人怎样否定机器值:线索只在「待处理且判定方式为空」时判定一次，判过的永不回头(重判定只能在命令行显式执行)，所以人改了、清空了的不会被填回;商机上人要否定机器值时写明确的文字(「无」「不详」)，不要清空——清空即「空值」，机器会再填(写进《表格使用说明》)。列表只追加的键 = 出处线索号 + 规范化文本;待核更新的键 = 出处线索号 + 字段，人驳回的行首加 ✗ 保留，机器不再提。只新建的去重键:时间节点 = 所属 + 类型 + 日期原文;商机先按外部编号、别名、名称挂接，挂不上才新建。
    enforce: tests/test_ontology.py 检查机器的行为不写 human 属性;写入层(core/tstore.py)统一"只填空、列表只追加"，单测覆盖;机器用单独的账号，表格的修改历史分得清人与机器
    why: 不需要"三方比较判断谁改的"，也不需要记同步状态;人对机器的修正永远有效
  - id: R3
    name: 公开事实带出处
    text: 商机、时间节点上的每条公开事实引用一条线索(写在出处线索里，长文本里标线索号);国别数据带年份与来源;推断的写明依据。
    enforce: 写入时校验;核实状态由此派生
    why: 沿用现有纪律;出处就是线索，不再另设来源登记
  - id: R4
    name: 线索至多属于一个商机
    text: 一条线索最多属于一个商机。机器只在归属可靠且为空时代填，其余给出建议等人确认;人定了的机器不再改。
    enforce: 所属商机为单值关联;不可靠的写在「建议所属商机」
    why: 线索的"去处"唯一，漏斗与报告才数得清
  - id: R5
    name: 我方阶段只由人推进
    text: 机器只能新建「建议」阶段的商机;立项、推进、结束都由人。
    enforce: tests/test_ontology.py 检查机器新建商机的初值
    why: 建议商机与跟踪商机同表，区别只在人有没有立项
  - id: R6
    name: 改阶段留一条跟进
    text: 商机的我方阶段每次变化，都对应一条跟进记录(谁、何时、从什么改成什么)，人可补写原因。
    enforce: A18 由机器按「阶段修改人、阶段修改时间」自动补记
    why: 阶段变化自然进日历与周报，人不用重复录入
  - id: R7
    name: 跟进必须关于商机
    text: 跟进记录必须关联一个商机;线索上只有处理状态与处理备注，不挂进展、负责人、下一步。
    enforce: 跟进记录的商机为必填;线索表不设这些字段
    why: 现在线索上挂着进展、负责人、下一步，才需要"线索上的进展就是所属商机的进展"这类转换
  - id: R8
    name: 用户上传不判定
    text: 同事上传的线索视为相关，不经相关性判定;机器只补标题、摘要、国别与日期。
    enforce: 上传时 relevant 初值为是，判定跳过相关性
    why: 照使用方流程图
  - id: R9
    name: 报告是快照
    text: 报告生成后不改，再生成即新版本;公开版不含内部信息(跟进、判断、优先级、负责人、内部备注)。
    enforce: 报告只追加;生成公开版时不读 human 属性与跟进记录
    why: 报告引用的事实可追溯到当时
  - id: R10
    name: 派生不存
    text: 日历、线索总览漏斗、待处理清单、当前判断、下一步、最晚启动等都由已有属性算出，不另存。
    enforce: derived 属性不出现在任何行为的 writes 里(测试检查);在 Teable 里做成汇总、查找、公式字段，或在自建页面里现算
    why: 没有副本就不会不一致
  - id: R11
    name: 不物理删除
    text: 线索、商机不删除，用「已忽略」「不跟进」「放弃」表达;跟进记录可改可删，但保留修改历史。
    enforce: 业务库开记录历史;页面上没有删除按钮(R13)
    why: 漏斗、报告的历史数字不变
  - id: R12
    name: 「今天」不进库公式
    text: 任何与「今天」有关的判断(未来 N 天、逾期、最近截止、下一节点、最晚启动)由页面与后台按当前日期现算;库里含 TODAY() 的公式与「今天」筛选只当参考，不作口径。
    note: 阶段 A 复核(2026-10-04)的结论:Teable 含 TODAY() 的公式与按 today 筛选的条件查找隔天不自动重算，值停在建表或上次改动那天。后台每天把过期节点改为「已发生」(A19)触发一次重算，让表里的值不至于太旧。
    enforce: 页面(portal.js)与报告(core/jobs/reports.py)自己算日期窗口;派生属性的 where 标明含今天;A19 每天跑
    why: 否则日历、线索总览卡片与表格视图各说各话
  - id: R13
    name: 页面是工作台，不是第二份数据
    text: 页面(portal)只读写 Teable，不另存任何业务数据;写入以登录人身份、走表格同样的权限;页面上只做最常用的几个动作(归入、忽略、跟踪、不跟进、记跟进、要报告、改负责人 / 优先级 / 备注、传模板)，不删记录;其余仍在表格里做。
    enforce: 页面只用 Teable 的记录接口，配置(portal/config.json)只存表与字段编号;页面不出现删除;页面受菜单约束:首页 + 工作原理、市场背景、项目线索、商机跟进四组共十二页(portal.js 的 MENU;商机工作台、我的、我方资料不进菜单)
    why: 表格适合当台账不适合当工作台(2026-10-03 返修结论);但页面越加越多会变成第二个系统
  - id: R14
    name: 统计口径只定一次
    text: 同一个概念(跟踪中的商机、AI 推荐的商机、待处理、待确认归属、逾期)在线索总览卡片、漏斗、日历、报告、表格视图里用同一条件;条件写在 glossary 里，页面与后台引用它，不各自再定。
    enforce: glossary 里给出条件;tests/test_ontology.py 检查页面(portal.js)与报告代码的阶段集合与本体一致;漏斗每一级是上一级的子集
    why: 2026-10-03 返修前五级漏斗各数各的、「写进报告」数全库，数字对不上就是口径不一

# 事件闭环(ME):when 发生什么 → then 哪些行为
events:
  - {id: E1, when: 新线索入库, then: [A03]}
  - {id: E2, when: 判定为归属可靠, then: [A07], note: 自动归属后更新商机事实与时间节点}
  - {id: E3, when: 判定为可能新项目, then: [A06], note: "建为「建议」商机，等人立项或不跟进"}
  - {id: E4, when: 商机的我方阶段被人改了, then: [A18], note: 自动补一条跟进;之后的情况人记跟进(A10)}
  - {id: E5, when: 时间节点或下一步到期临近(14 天内), then: [], note: "提醒负责人(评论 @ 负责人)还没做;现在靠「商机总览 · 下一步已逾期」与日历高亮(V9、V5)替代"}
  - {id: E6, when: 每周一 / 每月 1 日, then: [A14]}
  - {id: E7, when: 报告表里有人发起的待生成报告, then: [A14], note: 后台每 2 分钟看一次}
  - {id: E8, when: 每天零点后(后台第一个周期), then: [A19, A49], note: 过期节点改已发生，顺带触发库里含今天的公式重算(R12);过期线索标归档}
  - {id: E9, when: 同事在线索表新建一行(用户上传), then: [A03], note: 每 2 分钟补全(core.jobs.enrich);不判相关性(R8)}
  - {id: E10, when: 每天采集完成(08:30 后), then: [A14], note: 机器自建当天的日报行(同一天只建一次)，下个周期生成;「线索分析」页顶部显示它的正文}

# 视图(查询，不存;R10)。of 为用到的对象;query 用口径(glossary)写;channel 在哪看(表格 = Teable 视图，页面 = portal)。
views:
  - {id: V1, name: 待处理线索, of: [lead], channel: [表格, 页面], query: "是否相关 = 是 且 处理状态 = 待处理，按最近截止升序;线索总览卡片「待处理线索」同此"}
  - {id: V2, name: 待确认归属, of: [lead], channel: [表格, 页面],
     query: "所属商机为空，且(有建议所属商机、处理状态不是已忽略)或(可能是新项目、处理状态是待处理);已处理的可能新项目是人看过的，不再提。表格视图、线索总览卡片、「线索处理」第一页同一条件(glossary.to_assign)"}
  - {id: V3, name: AI 推荐的商机, of: [opportunity], channel: [表格, 页面], query: "我方阶段 = 建议(glossary.ai_suggested);国别报告的项目机会清单、线索总览卡片、「线索处理」第二页就是它;表格里的视图名仍叫「建议商机」"}
  - {id: V4, name: 跟踪看板, of: [opportunity], channel: [表格], query: "我方阶段 ∈ 跟踪中、准备投标、已投标，按阶段分列(看板拖动即改阶段，A09)"}
  - {id: V5, name: 日历, of: [milestone, followup, report], channel: [页面, 表格],
     query: "缺省:跟踪中商机(glossary.tracked)的时间节点(日期) ∪ 其跟进记录(日期、下一步到期) ∪ 报告(日期);勾「也显示未归商机的线索截止」才加上挂在线索或国别上的节点(灰色);一格最多直接显示 6 条。表格里的两个日历视图不过滤"}
  - {id: V6, name: 线索总览漏斗, of: [lead, opportunity, report], channel: [页面],
     query: "五级严格子集，每级数线索条数:信源采集(全部)→ 相关(是否相关 = 是)→ 归入商机(所属商机非空)→ 归入跟踪中的商机(所属商机 ∈ glossary.tracked)→ 写进报告(写进的报告非空);国别 / 领域 / 类别 / 发现时间筛选作用于每一级;点一级右边列出该级最新 100 条"}
  - {id: V7, name: 国别概况, of: [country, opportunity, lead, milestone, city, water_area, award, study, water_event, law, local_term, discharge_limit], channel: [页面, 表格], query: "页签分三组:基本信息(概况、机构与法规、营商环境、规模以上城市、水务片区:这国划了片区才有)→ 历史信息(水务历史资料、已中标项目)→ 动态信息(商机、线索、时间节点)。一国的国别信息(指标表、机构 / 国企 / 法规表、带标签的备注)+ 该国商机按阶段 + 线索统计 + 国别级时间节点 + 规模以上城市(人口、面积、密度、生产总值、线索数、商机数)+ 水务历史资料(最上面「大事记」:水务事件.所属国别 = 它,加上每年最大的三笔已中标项目,按年份从新到旧、按类别筛选;下面研究资料.所属国别 = 它:综述展开在最前(要点速览指标卡、分节目录,出处是带序号的小角标,点开看全称、页码与原文),其余按类型筛选、从新到旧,标题点开看原文);引用角标 ①②③ 指向线索;「营商环境」页签(世界银行 B-READY):指标卡(总分、供水得分、公共采购得分、商业水价),低于门槛的标红写明含义,外企参标限制、大型工程授标天数、政府合同回款天数、企业供水可靠比例、接水天数,细项分供水、采购两栏,注明数据版本与原文链接;这一期没覆盖的国家写明未覆盖;「已中标项目」页签(所属国别 = 它):按类别、合同类型、承包模式、主体工程、金额(折合人民币分档)、年份筛选(各项可多选,筛选项上的数跟着别的项走),卡片(项目数、合计中标价折合人民币、最大一笔、中国企业中标数;有数时加中标价 / 招标估价、评标天数的中位数),表默认按中标时间从新到旧,可改按最早、金额最高、金额最低排;中标价下面写招标估价和比例,中标时间下面写评标天数、投标家数;「机构与法规」页签:机构、国企、法规简表下面是「排放标准」(排放限值.所属国别 = 它,按法规分块,指标、限值与单位、口径、排到哪里、适用范围、出处条号角标;待核实的标出;一国几种口径分开列)、「本国定义」(国别定义.所属国别 = 它:通用概念、本国说法与原文用词、本国定义、和通用说法的关系与差别)、「法规原文」(法规.所属国别 = 它,按类别,条文数,点名称进 V21);这国还没收原文的写明"}
  - {id: V8, name: 线索处理, of: [lead, opportunity], channel: [页面],
     query: "两页带计数:待确认归属(= V2)/ AI 推荐的商机(= V3);待确认归属可按国别、类别、有无机器建议筛选，两页都可多选后批量归入 / 忽略 / 跟踪 / 不跟进(A20)。原名「待我处理」;v2.6 起下一步已逾期、待核更新两页在商机总览(V9)"}
  - {id: V9, name: 商机总览, of: [opportunity], channel: [页面], query: "三页，都只算 glossary.decided(AI 推荐、不跟进的不进来，筛选数字也只在这些里数):商机列表(缺省只列 glossary.tracked，可切到某一阶段或全部已立项;按阶段顺序(跟踪中、准备投标、已投标、中标、未中标、放弃)再按编号;可按国别、负责人筛选;点进商机工作台)/ 下一步已逾期(glossary.overdue)/ 待核更新(glossary.review);后两页带计数，只列出来，点进商机工作台或表格去改，游客不显示。商机列表顶上提醒「今天有 N 个商机有新线索」(近 7 天挂到商机上的线索按商机数，今天按当前日期现算，R12)，名称后带「今日新线索 +N」或「近 7 天 +N」，「更新」筛选只看这些。原名「商机列表」"}
  - {id: V10, name: 商机工作台, of: [opportunity, followup, milestone, lead, report], channel: [页面],
     query: "一个商机一页:左边表单(记跟进可顺带改阶段、要报告、改负责人 / 优先级 / 内部备注);右边概览、待核更新提示、跟进时间线、时间节点、项目事实(带出处角标)、所属线索、已出报告"}
  - {id: V11, name: 报告页, of: [report, template], channel: [页面], query: "历史报告按类型 / 版本 / 生成状态 / 国别筛选、搜索、下载;左栏发起国别或项目报告(可选模板);「报告模板」一节列模板、换文件、设缺省、上传新模板(A21)"}
  - {id: V12, name: 线索分析, of: [lead, country, opportunity, source, report], channel: [页面],
     query: "顶部是最近一份日报的正文(report.kind = 日报，取日期最新的);下面按发现时间窗口(今天 / 7 / 30 / 90 天 / 全部)、是否只看相关、经营区域筛选后现算:每日新增走势(相关 / 不相关)、国别前 15、国别 × 类别热力、类别、领域(lead_sectors 7 类)、资金来源(groupings.funders)、信源前 15、判定方式、处理状态、归属(所属 / 建议 / 可能新项目 / 无);点任一柱右栏列出该组线索。数字与线索总览同一口径:线索总数 = 线索总览「线索」卡，待处理 = glossary.pending_leads，待确认归属 = glossary.to_assign(R14)"}
  - {id: V13, name: 本体, of: [lead, country, opportunity, followup, source, milestone, report, template, member, city, phrase, term, local_term, ask_log, review], channel: [页面],
     query: "只读:对象与关系图(公开 / 业务两种颜色，核心对象描边，箭头是关联)，点一个对象看定义、标识、状态流转、按写入方分组的属性(单选 / 多选的指向分类体系)、关系、涉及它的行为;下面页签:分类体系(每个值的英文键、定义、边界、示例)、语义层(指标:单位、算法、缺数时怎么说、说法;算法、主体工程、法规问法、排放指标的说法;行业术语;本国定义按国别数;有歧义的说法;错题本(「助手提问记录」里答对、答错、待看几句,待看与复查不通过的列出来)。说法读「语义层说法」表,读不到时显示本体初始说法,表里指向写错的标出;各块有「在表格里打开」)、口径与归组、规则、行为、视图与事件、版本记录。除语义层外读 portal/ontology.json(ontology.yaml 转的)，不读库"}
  - {id: V14, name: 我方资料页, of: [company, country], channel: [页面], query: "从「我的」页进(不在主菜单):全部公司资料按类别 / 领域 / 国别筛选,搜索;新增、改、传附件、勾「写进报告」(A23);游客看不到"}
  - {id: V15, name: 我的, of: [preference, country, member], channel: [页面], query: "登录人自己的一行:帐号与角色、关注的国别(加减,点进国别页;清单里这些国家排前、带 ★)、忽略的国别(地图上点选、按大洲一键;地图上涂成灰色,采集不再涉及)、保存的日历订阅(复制链接、删除)(A24);入口到帐号设置、退出登录、我方资料"}
  - {id: V17, name: 趋势机会, of: [city, country, lead], channel: [页面], query: "规模以上城市按 glossary.trend_self_funded(自付型,青绿)与 glossary.trend_loan_driven(贷款型,紫)着色,两类都是的标红,都不是的灰色小点;门槛(水风险用哪一项及多少分、人均 GDP 多少、贷款判定)页面上可调并记在网址里;下面按类分列城市(水风险从高到低)与国别对照表。是趋势参考:页首写明按公开数据推算、不是具体项目,数字不计入线索、商机;只看中国以外(使用方 2026-10-09 定,中国境内的城市与国别不进地图、清单与卡片)"}
  - {id: V18, name: 信源, of: [source, country], channel: [页面, 表格], query: "全部信源:名称与网址、类型、范围(全球或国别)、最近采集、状态、线索数、启用;状态口径:停用 / 出错、被拒 / 启用着却两天以上没采集(多日未采集)/ 正常、无条目;有问题的(出错、被拒、多日未采集)整行标红排最前,其余按线索数从多到少;按状态、范围筛选(筛选项上的数跟着其他筛选走)、搜索;编辑者点「启用」停用或重新启用一个信源;游客看示例"}
  - {id: V19, name: 供应商页, of: [contractor, award, country], channel: [页面], query: "从已中标项目表里点供应商进(不在主菜单):卡片(中标份数、合计中标价、涉及几个国家、最近一次中标)、基本信息(人补的中文名、性质、母公司、官网、主营领域、简介)、它的全部已中标项目(中标方含它),按国别、类别、年份筛选"}
  - {id: V20, name: 水务片区, of: [water_area, city, country, opportunity, lead, water_event, award, supply_plant, sewage_plant], channel: [页面], query: "不进菜单(2026-10-14 起):国别概况「水务片区」页签列这国的片区(名称、包含城市、合计人口与占全国、服务水司、商机数),城市页与商机的所属片区也点进来;不带编号是全部片区(留给旧链接);一个片区:卡片(合计人口、占全国人口、商机、线索)、
      概况(所属国别、包含城市及人口、服务水司、主要水源、范围说明、划分依据)、商机(所属片区 = 它,或所在城市在片区里;按我方阶段)、线索(这些商机的线索,加上涉及城市在片区里的,最近的在前)、
      大事记(水务事件.所在城市在片区里,加上每年最大的三笔片区内已中标项目,同国别概况)、水厂(自来水厂、污水厂.所在城市在片区里)"}
  - {id: V16, name: 城市概况, of: [city, country, opportunity, lead, supply_plant, sewage_plant, award, water_event], channel: [页面], query: "全部规模以上城市按人口从多到少,可按国别、有线索 / 有商机筛选,按中文名、英文名、行政区搜索;地图上的分布(圆点大小是人口,颜色深浅是人口或生产总值,红圈有线索或商机)左下角有滑块(和国别地图一样),按人口或地区生产总值拖出一个范围,卡片(城市数、合计人口、百万人口以上、有线索、有商机的城市数)与清单(前 300 座)只算范围内的;点一座城市:人口、面积、密度、生产总值卡片,概况(所属国别、行政区、坐标、来源、备注、小地图)与商机(商机.城市 = 它)、线索(线索.城市 = 它)、水厂(自来水厂、污水厂.所在城市 = 它)三个页签;清单多自来水厂数、污水厂数两列;一座城市的页面最下面「已中标项目」(所属城市 = 它),与国别概况同一张表;其上「大事记」(水务事件.所在城市 = 它,加上每年最大的三笔挂在这座城市的已中标项目)"}
  - {id: V21, name: 法规全文, of: [law, law_clause, local_term, discharge_limit], channel: [页面], query: "不进菜单:从国别概况「机构与法规」页签、助手答案的出处角标点进来(law.html?k=法规编号#条文序号)。上面是名称、原文名称、文号、颁布日期、现行状态、版本说明、原文链接;中间是从这部法规摘的排放限值与国别定义;下面按顺序排出全部条文,每条中文在前、原文可展开(没译的先显示原文),按章节分段,可在页内搜索;带 #序号 进来的滚到那一条并高亮"}

# 现状对照(MM，2026-10-04):每种对象现在只存一处——Teable 库「水务项目机会 新版」的一张表(R1 已做到;切换前的多处存放见 git 历史里的 v1.2)。
# 后面一行写"除表之外还有什么":只允许是配置、缓存或可再生的东西，不是第二份数据。
as_is:
  lead:
    - Teable「线索」表(唯一)
    - 本机缓存:网页正文与附件文本、各信源已见条目(丢了只会多算一遍，去重按线索号与原文网址)
  opportunity:
    - Teable「商机」表(唯一)
  followup:
    - Teable「跟进记录」表(唯一)
  country:
    - Teable「国别」表(唯一)
    - 配置:profile 的 countries(ISO3、英文名、市场分级初值)、reference/*.yaml 的基础与水务资料(机器写进表时的来源之一)
  milestone:
    - Teable「时间节点」表(唯一;303 条里约 2/3 是线索截止，没挂商机，日历缺省不显示)
  report:
    - Teable「报告」表(唯一，文件在附件里)
  template:
    - Teable「报告模板」表(唯一;自带版式登记为第 1 行、四类缺省)
    - 自带模板文件 private/templates/*.docx(表里没有可用模板时的兜底)
  source:
    - Teable「信源」表(抓不抓、抓得怎样)
    - 配置:git 的 countries/<国别>/watch.yaml、global/watch.yaml(怎么抓;按信源编号对应)
  member:
    - Teable 空间成员(唯一;角色在空间里设)
  supply_plant:
    - Teable「自来水厂」表(唯一)
    - 导入来源:私有配置仓 data/plants.csv.gz(water-tracker 导出)
  sewage_plant:
    - Teable「污水厂」表(唯一)
    - 导入来源:私有配置仓 data/plants.csv.gz(water-tracker 导出)
  city:
    - Teable「城市」表(唯一)
    - 本机缓存:GeoNames 的城市与行政区数据文件(可再取)
  award:
    - Teable「已中标项目」表(唯一)
    - 导入来源:私有配置仓 data/awards*.csv.gz(scripts/fetch_wb_awards.py、fetch_wb_old_awards.py 从世界银行公开数据取(2019 年起、2019 年以前);scripts/fetch_ma_awards.py 从摩洛哥公共采购网取;scripts/fetch_adb_awards.py、fetch_ebrd_awards.py 从亚行、欧洲复兴开发银行取;scripts/fetch_kg_awards.py 从吉尔吉斯斯坦国家采购门户取)
  contractor:
    - Teable「供应商」表(唯一;机器从已中标项目的中标记录建行)
  water_area:
    - Teable「水务片区」表(唯一;人划定)
  water_event:
    - Teable「水务事件」表(唯一)
    - 导入来源:私有配置仓 data/events.csv.gz
  study:
    - Teable「研究资料」表(唯一)
    - 导入来源:私有配置仓 data/studies.csv.gz(scripts/fetch_wb_studies.py 从世界银行文件库取;原文 PDF 只存链接)
  law:
    - Teable「法规」表(唯一)
    - 导入来源:私有配置仓 data/laws.csv(scripts/fetch_laws.py 按 data/law_sources.csv 取原文;原文文件只存链接)
  law_clause:
    - Teable「法规条文」表(唯一)
    - 导入来源:私有配置仓 data/law_clauses.csv.gz
  local_term:
    - Teable「国别定义」表(唯一)
    - 导入来源:私有配置仓 data/local_terms.csv(读条文摘出)
  discharge_limit:
    - Teable「排放限值」表(唯一)
    - 导入来源:私有配置仓 data/discharge_limits.csv(读条文摘出)
  company:
    - Teable「公司资料」表(唯一,附件在行里)
  preference:
    - Teable「个人设置」表(唯一;标识 = 「账号」成员字段,一个账号一行)
  term:
    - Teable「行业术语」表(唯一)
    - 本体 terms 节:建表时的初始词;表没建或读不到时助手用它兜底
  ask_log:
    - Teable「助手提问记录」表(唯一)
  review:
    - Teable「助手复核记录」表(唯一;看链接的结果页按材料读它)
  partner_account:
    - Teable「伙伴帐号」表(唯一);私有 team.yaml 的 partners 名单作后备(没建表、或表里没写的邮箱)
  phrase:
    - Teable「语义层说法」表(唯一)
    - 本体 semantic 节:初始说法;后台按它给表里没有的指向补行(A43),表没建或读不到时助手用它兜底

# 分类体系(taxonomies):每个枚举属性的值集、分组、定义、边界与示例。values 的顺序就是显示顺序;code 是代码里的英文键(core.jobs.common 等)。
# 属性上 taxonomy: <id> 指向这里;tests 检查属性的 enum 与这里的 values 完全相同(顺序也相同)。改选项先改这里与属性，再在 Teable 里加选项(只增不删)，再改 code_enums 列的代码。
taxonomies:
  lead_category:
    name: 线索类别
    used_by: [lead.category]
    note: 一条线索一个类别。四组按"离采购多近"排:采购类 > 融资类 > 立项类 > 动态与政策;原文同时是几件事时取靠前的组。采购类 + 融资 = 代码里的 PROCUREMENT(漏斗与门槛用)。
    groups:
      - name: 采购类(有明确的招标动作，通常带截止日)
        values:
          - {v: 招标, code: tender, def: 招标公告或招标文件发布，邀请投标, boundary: "有标号、截止日、文件获取方式;总采购公告(GPN)不算", example: "ADSEA 发布 Absheron 输水干管 Lot 2 招标，2026-12-15 截止"}
          - {v: 意向书, code: eoi, def: 征集意向书(EOI / REOI)，多见于咨询服务与 PPP 前期, boundary: "征集的是「有没有兴趣」，不是报价;截止日记为意向书截止", example: "世行项目征集可研咨询意向书"}
          - {v: 资格预审, code: prequalification, def: 资格预审公告(PQ)，先筛资格再发标, boundary: 截止日记为资格预审截止, example: "海水淡化厂 EPC 资格预审"}
          - {v: 总采购公告, code: gpn, def: 多边银行项目的总采购公告(GPN):项目要买什么、大致何时, boundary: "没有具体标段与截止日;有的就是招标", example: "世行 P178412 的 GPN"}
          - {v: 特定采购公告, code: spn, def: 多边银行项目的特定采购公告(SPN):某个具体标段的采购公告, boundary: "与「招标」的区别只在发布渠道(多边银行门户);两者都算招标动作", example: "亚开行门户上的 Lot 3 SPN"}
          - {v: 授标或短名单, code: award, def: 定标、授标、合同签署或咨询短名单公布, boundary: "标志一个采购动作结束;对我方是「晚了」或「看竞争者」的信号", example: "Lot 1 授予某联合体，合同 4，200 万美元"}
      - name: 融资类
        values:
          - {v: 融资, code: financing, def: 贷款 / 赠款的批准、签署、生效，或融资谈判, boundary: "有出资方与金额;只提「拟申请贷款」的归立项或规划", example: "亚开行董事会批准 1.5 亿美元供水贷款"}
      - name: 立项类
        values:
          - {v: 立项或规划, code: plan, def: 项目进入规划、可研、立项、列入投资计划, boundary: "还没有采购与融资动作;国家层面的行业规划也算", example: "政府批准 2030 供水总体规划，列入 12 个项目"}
      - name: 动态与政策
        values:
          - {v: 项目动态, code: project_news, def: 已有项目的进展报道:开工、完工、停工、调整, boundary: "必须指向一个具体项目;否则是政策或其他", example: "某污水厂一期完工通水"}
          - {v: 政策, code: policy, def: 法规、水价、机构改革、行业政策、国际合作框架, boundary: 不指向具体项目, example: "新《水法》生效，私营参与放开"}
          - {v: 其他, code: other, def: 相关但归不进上面任何一类;规则初筛没过、或只是页面变化的也在这里, boundary: "代码里 page(页面变化)也映射到这里", example: "行业会议报道"}
  lead_sectors:
    name: 线索领域(粗分 7 类)
    used_by: [lead.sectors, company.sectors, term.covers, term.sectors, award.sector, contractor.sectors]
    note: 多选。它是商机领域 12 类的上级(见 opp_sectors 的 parent);线索总览「领域」筛选按它。核心领域 = 供水、污水、海水淡化、雨水排涝、水环境;水利要看 profile 的 sector_scope(灌溉排水 / 防洪流域开了才算核心)。
    groups:
      - name: 全部
        values:
          - {v: 供水, code: water_supply, def: 饮用水与工业供水的取水、净水、输配、减漏与计量, boundary: 含输水干管、水库取水;灌溉用水归水利, example: "城市供水管网改造"}
          - {v: 污水, code: wastewater, def: 污水收集、处理、污泥与再生水, boundary: 含卫生设施;雨污分流中的雨水部分归雨水排涝, example: "污水处理厂扩建"}
          - {v: 水利, code: hydraulic, def: 水库、灌溉、渠道、调水、防洪等水资源工程, boundary: 以农业或防洪为目的;以供水为目的的水库归供水, example: "灌区现代化"}
          - {v: 海水淡化, code: desalination, def: 海水与苦咸水淡化, boundary: 含配套取水与输水, example: "RO 海水淡化厂 BOT"}
          - {v: 雨水排涝, code: stormwater, def: 城市雨水、排涝、内涝治理, boundary: 河道防洪归水利, example: "城市排水系统升级"}
          - {v: 水环境, code: environment, def: 河湖水环境治理、生态修复、流域综合治理, boundary: 以环境目标为主;单纯污水厂归污水, example: "城市河道综合治理"}
          - {v: 其他, code: other, def: 相关但归不进上面任何一类, boundary: "", example: "水务数字化平台"}
  opp_sectors:
    name: 商机领域(细分 12 类)
    used_by: [opportunity.sectors]
    note: "多选。parent 是线索领域 7 类之一:页面按 parent 把商机归到粗分里筛选;机器从线索领域只能推出五个(供水、污水、海水淡化、雨水排涝、水环境治理)，水利下的灌溉 / 防洪 / 水库调蓄分不出，留给人填。代码里 core.ledger.SEGMENTS 用「水库/调蓄」「减漏/计量」带斜杠的写法，写进表前去掉斜杠(migrate 的 SEG)。"
    groups:
      - name: 供水
        values:
          - {v: 供水, code: water_supply, parent: 供水, def: 净水厂、配水管网、泵站等供水主体工程, boundary: "", example: "巴库净水厂扩建"}
          - {v: 输水干管, code: transmission, parent: 供水, def: 长距离原水或清水输水管线, boundary: 以输送为主，不含净水, example: "DN1200 输水干管 80 km"}
          - {v: 水库调蓄, code: reservoir, parent: 供水, def: 为供水服务的水库、调蓄池, boundary: 以灌溉或防洪为主的水库归灌溉 / 防洪, example: "调蓄水库与取水口"}
          - {v: 减漏计量, code: nrw, parent: 供水, def: 产销差(NRW)治理、智能水表、分区计量, boundary: "", example: "智能水表 20 万只"}
      - name: 污水
        values:
          - {v: 污水, code: wastewater, parent: 污水, def: 污水收集管网与处理厂, boundary: "", example: "污水厂 10 万吨/日"}
          - {v: 污泥, code: sludge, parent: 污水, def: 污泥处理处置, boundary: "", example: "污泥干化焚烧"}
          - {v: 再生水, code: reuse, parent: 污水, def: 再生水回用, boundary: "", example: "再生水灌溉工程"}
      - name: 雨水排涝
        values:
          - {v: 雨水排涝, code: stormwater, parent: 雨水排涝, def: 城市雨水与排涝, boundary: "", example: "排水泵站与管涵"}
      - name: 海水淡化
        values:
          - {v: 海水淡化, code: desalination, parent: 海水淡化, def: 海水与苦咸水淡化, boundary: "", example: "日产 10 万吨 RO"}
      - name: 水利
        values:
          - {v: 灌溉, code: irrigation, parent: 水利, def: 灌区、渠道、灌溉现代化, boundary: "", example: "灌区节水改造"}
          - {v: 防洪, code: flood, parent: 水利, def: 防洪堤、河道整治、流域防洪, boundary: 以环境修复为主的归水环境治理, example: "河道防洪堤 30 km"}
      - name: 水环境
        values:
          - {v: 水环境治理, code: environment, parent: 水环境, def: 河湖水环境与生态治理, boundary: "", example: "湖泊生态修复"}
  public_stage:
    name: 公开进度(项目生命周期)
    used_by: [opportunity.public_stage]
    note: 项目本身走到哪，公开可查;与「我方阶段」正交。前七个是顺序，后两个是搁置。机器只填空、前进了写待核更新;从线索类别推:采购类 → 采购进行中，授标 → 已定标，融资 → 融资已落实，立项 → 规划(PUBLIC_STAGE_OF)。
    groups:
      - name: 顺序
        values:
          - {v: 规划, code: planning, def: 列入规划或概念阶段, boundary: 还没有可研或融资动作, example: 列入 2030 供水规划}
          - {v: 前期, code: preparation, def: 可研、设计、融资洽谈, boundary: 融资未签, example: 可研完成，与亚开行洽谈}
          - {v: 融资已落实, code: financing_signed, def: 贷款 / 赠款已批准或签署, boundary: 采购未开始, example: 贷款协议签署}
          - {v: 采购进行中, code: procurement, def: 任一标段在招(GPN、SPN、招标、EOI、PQ), boundary: 有标段授标但仍有在招的，仍算采购进行中, example: Lot 2 在招}
          - {v: 已定标, code: awarded, def: 主要标段已授标, boundary: 未开工, example: EPC 授标}
          - {v: 在建, code: construction, def: 已开工, boundary: "", example: 开工}
          - {v: 已完工, code: completed, def: 完工或投运, boundary: "", example: 通水}
      - name: 搁置
        values:
          - {v: 暂停, code: on_hold, def: 官方宣布暂停或长期无进展, boundary: "", example: 融资撤回暂停}
          - {v: 取消, code: cancelled, def: 官方取消, boundary: "", example: 项目取消}
  stage:
    name: 我方阶段
    used_by: [opportunity.stage, followup.stage_change]
    note: 我方对这个项目做到哪一步，只由人改(R5);每次改阶段机器补一条跟进(A18、R6)。三组;「在跟踪」就是口径 glossary.tracked。「观望」不是阶段(它是跟进的判断)，页面与报告的排序里不再出现。
    groups:
      - name: 未立项
        values:
          - {v: 建议, code: suggested, def: 机器建议的、人还没定的商机(页面上叫「AI 推荐的商机」), boundary: 机器新建只能是它(R5), example: 后台从招标线索新建}
          - {v: 不跟进, code: dropped, def: 人看过、决定不跟, boundary: 可撤回到建议, example: 领域不符}
      - name: 在跟踪
        values:
          - {v: 跟踪中, code: tracking, def: 已立项，收集信息、接触业主, boundary: 立项即由建议改到这里, example: 立项跟踪}
          - {v: 准备投标, code: preparing, def: 决定投标，组联合体、做标书, boundary: "", example: 标书编制中}
          - {v: 已投标, code: submitted, def: 标书已递交，等开标 / 评标, boundary: "", example: 已递交}
          - {v: 中标, code: won, def: 中标或签约, boundary: 仍算在跟踪(履约期继续记跟进), example: 中标}
      - name: 已结束
        values:
          - {v: 未中标, code: lost, def: 投了没中, boundary: "", example: 未中标}
          - {v: 放弃, code: abandoned, def: 跟踪或投标过程中决定不再投入, boundary: 与「不跟进」的区别是曾经立项过, example: 放弃}
  milestone_kind:
    name: 时间节点类型
    used_by: [milestone.kind]
    note: 四组。采购截止是投标人要动作的节点，只有它们算「最晚启动」(lead_times);代码 core.ledger.MILESTONES 有更细的英文键(立项/概念审查、谅解备忘录、协议生效、商业运营)，迁移时归到「其他」并把原名写进说明。
    groups:
      - name: 采购截止(投标人要动作)
        values:
          - {v: 意向书截止, code: eoi_deadline, def: EOI 递交截止, boundary: "", example: 2026-11-30}
          - {v: 资格预审截止, code: pq_deadline, def: PQ 递交截止, boundary: "", example: 2026-12-10}
          - {v: 投标截止, code: bid_deadline, def: 投标文件递交截止, boundary: 含 RFP 的工程 / 货物标, example: 2027-01-15}
          - {v: PPP标书截止, code: rfp_deadline, def: PPP / 特许经营建议书递交截止, boundary: "", example: 2027-Q1}
      - name: 采购节点
        values:
          - {v: 招标发布, code: tender_launch, def: 招标文件发布(预计或实际), boundary: "", example: 2026-Q4}
          - {v: 开标, code: bid_opening, def: 开标日, boundary: "", example: 2027-01-15}
          - {v: 授标, code: award, def: 定标 / 授标, boundary: "", example: 2027-03}
          - {v: 合同签署, code: contract_signing, def: 承包合同签署, boundary: 贷款协议签署归贷款签署, example: 2027-04}
      - name: 融资与批准
        values:
          - {v: 贷款签署, code: loan_signing, def: 贷款 / 赠款协议签署, boundary: "", example: 2026-09}
          - {v: 董事会批准, code: board_approval, def: 多边银行董事会批准, boundary: "", example: 2026-06-20}
      - name: 实施
        values:
          - {v: 开工, code: construction_start, def: 开工, boundary: "", example: 2027-H2}
          - {v: 完工, code: completion, def: 完工 / 投运, boundary: "", example: 2029}
          - {v: 其他, code: other, def: 归不进上面的(立项审查、备忘录、协议生效、商业运营、投资论坛等)，说明里写原名, boundary: "", example: "投资论坛 · 2026-05-12"}
  milestone_status:
    name: 时间节点状态
    used_by: [milestone.status]
    note: 日期过了由后台改成「已发生」(A19)。
    groups:
      - name: 全部
        values:
          - {v: 已发生, code: actual, def: 已经发生的日期, boundary: 日期 < 今天的都算, example: ""}
          - {v: 官方计划, code: planned, def: 官方公布的计划日期, boundary: "", example: 招标文件写的截止日}
          - {v: 推断, code: expected, def: 机器或人推断的日期，说明里写依据, boundary: 出处线索可空, example: 按同类项目周期推断}
  eligibility:
    name: 投标资格
    used_by: [opportunity.eligibility]
    note: 以使用方(profile 的 bidder 国籍)能不能投为准;依据写在资格依据。
    groups:
      - name: 全部
        values:
          - {v: 可直接投标, code: open, def: 采购规则明确各国企业均可, boundary: "", example: 世行 / 亚开行 / 欧复行项目}
          - {v: 推定可投, code: presumed, def: 规则未明说但按惯例可投, boundary: "", example: 本国采购法允许外国企业}
          - {v: 有条件, code: conditional, def: 需本地注册、本地合作方或其他前置条件, boundary: 条件写在依据里, example: 需本地注册 90 天}
          - {v: 受限, code: restricted, def: 限定成员国 / 来源国，或我方不符, boundary: "", example: 限定出资国企业}
          - {v: 待核实, code: unknown, def: 还没查到规则, boundary: "", example: ""}
  verified:
    name: 核实状态
    used_by: [opportunity.verified]
    note: 由出处的质量派生性地判断;机器写，人可改。
    groups:
      - name: 全部
        values:
          - {v: 已核实, code: verified, def: 关键事实有一手来源(官方公告、银行门户), boundary: "", example: ""}
          - {v: 部分核实, code: partial, def: 部分事实有一手来源, boundary: "", example: ""}
          - {v: 未核实, code: unverified, def: 只有二手报道或成稿转引, boundary: "", example: ""}
          - {v: 来源冲突, code: conflict, def: 不同来源说法不一致, boundary: 冲突写进待核实, example: ""}
  judgment:
    name: 跟进判断
    used_by: [followup.judgment]
    note: 这一次跟进后的态度，不改阶段;「放弃」要落实为阶段才算(A09)。商机的「当前判断」= 最近一条非空的判断。
    groups:
      - name: 全部
        values:
          - {v: 继续跟进, code: continue, def: 按常规节奏跟, boundary: "", example: ""}
          - {v: 重点推进, code: push, def: 值得加大投入, boundary: "", example: ""}
          - {v: 观望, code: watch, def: 暂不投入，等待某个节点, boundary: 不是阶段, example: 等融资落实}
          - {v: 放弃, code: drop, def: 建议放弃, boundary: 阶段仍要人改, example: ""}
  lead_status:
    name: 线索处理状态
    used_by: [lead.status]
    note: 人改;撤回 = 改回待处理。
    groups:
      - name: 全部
        values:
          - {v: 待处理, code: pending, def: 还没人看过, boundary: 新线索的初值, example: ""}
          - {v: 已处理, code: done, def: 人看过并处理了(归入商机、记了备注), boundary: 页面「归入」即改到这里, example: ""}
          - {v: 已忽略, code: ignored, def: 人决定不要, boundary: 不删(R11), example: ""}
  judged_by:
    name: 判定方式
    used_by: [lead.judged_by]
    note: 为空即还没判定，机器只判这种(R2)。
    groups:
      - name: 全部
        values:
          - {v: 模型, code: llm, def: 大模型读原文判定, boundary: "", example: ""}
          - {v: 规则, code: rules, def: 规则初筛没过(关键词、信源范围)，没进模型, boundary: 也可能是模型没配, example: ""}
          - {v: 不判定, code: skipped, def: 用户上传或台账出处，不判相关性，只补全(R8), boundary: "", example: ""}
  origin:
    name: 来源方式
    used_by: [lead.origin]
    note: 表里新建一行缺省为用户上传(A02)。
    groups:
      - name: 全部
        values:
          - {v: 机器采集, code: crawl, def: 后台从信源采的, boundary: "", example: ""}
          - {v: 用户上传, code: manual, def: 同事在表里新建一行填网址, boundary: 信源记「人工上传」, example: ""}
  source_kind:
    name: 信源类型
    used_by: [source.kind]
    note: 怎么抓在 git 的 watch.yaml(kind 更细:html_list、links、rss、atexo_search、wb_procnotices、wb_projects、aiib、ckan、gdelt)，按 SOURCE_KIND 归到这五类。
    groups:
      - name: 全部
        values:
          - {v: 网页列表, code: html_list, def: 网页上的列表或链接页, boundary: "", example: 部委新闻页}
          - {v: RSS, code: rss, def: RSS / Atom 订阅, boundary: "", example: ""}
          - {v: 接口, code: api, def: 结构化接口, boundary: "", example: 世行采购公告接口、GDELT}
          - {v: 采购门户, code: portal, def: 电子采购门户的搜索, boundary: "", example: Atexo 门户}
          - {v: 人工上传, code: manual, def: 固定的一个信源，用户上传的线索挂它, boundary: "", example: ""}
  source_status:
    name: 信源最近状态
    used_by: [source.last_status]
    note: 机器运行状态，可直接更新(R2 例外)。
    groups:
      - name: 全部
        values:
          - {v: 正常, code: ok, def: 抓到条目, boundary: "", example: ""}
          - {v: 无条目, code: empty, def: 抓通了但没有新条目, boundary: "", example: ""}
          - {v: 出错, code: error, def: 抓取出错(网络、解析), boundary: "", example: ""}
          - {v: 被拒, code: blocked, def: 对方拒绝(403、验证码), boundary: "", example: ""}
  report_kind:
    name: 报告类型
    used_by: [report.kind, template.kinds]
    note: 两类一次性(人发起)、四类定期(机器自建;人也可在报告表或报告页补要一份)。
    groups:
      - name: 一次性
        values:
          - {v: 国别报告, code: country, def: 一国的国别概况 + 商机 + 线索 + 时间节点, boundary: 要选范围国别, example: ""}
          - {v: 项目报告, code: project, def: 一个商机的全部事实与进展, boundary: 要选范围商机, example: ""}
      - name: 定期
        values:
          - {v: 周报, code: weekly, def: 每周一 09:00，上一周, boundary: 期间 YYYY-Www, example: 2026-W40}
          - {v: 月报, code: monthly, def: 每月 1 日 09:30，上一月, boundary: 期间 YYYY-MM, example: 2026-09}
          - {v: 日报, code: daily, def: 每天采集完成后，当天的线索分析简报(短，几百字;正文也存在「简报正文」里), boundary: 期间 YYYY-MM-DD;统计与规则写，配了模型时多一段研判, example: 2026-10-07}
          - {v: 招标监测, code: tender_monitor, def: 一国在招的水务标段:截止日、金额、出资方、资格要求，每条带回原公告的角标;本期新发布、已截止与授标, boundary: 要选范围国别;只在人点「生成」时出，不自动建;期间 YYYY-MM-DD~YYYY-MM-DD，留空 = 近 30 天, example: "UZB 2026-10-05~2026-10-11"}
  edition:
