    各标段资格要求(配了模型时从原文抽;没配时按关键句规则抽,写明抽法)、覆盖说明(看了哪些信源、没覆盖什么);期间「YYYY-MM-DD~YYYY-MM-DD」,留空 = 到当天的近 30 天
