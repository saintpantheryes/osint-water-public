          - {v: AMD, code: amd, def: 亚美尼亚德拉姆}
          - {v: KGS, code: kgs, def: 吉尔吉斯斯坦索姆}
          - {v: TJS, code: tjs, def: 塔吉克斯坦索莫尼}
          - {v: TMT, code: tmt, def: 土库曼斯坦马纳特}
          - {v: MNT, code: mnt, def: 蒙古图格里克}
      - name: 欧洲与西亚
        values:
          - {v: TRY, code: try, def: 土耳其里拉}
          - {v: IQD, code: iqd, def: 伊拉克第纳尔}
          - {v: JOD, code: jod, def: 约旦第纳尔}
